[project]
name = "mountain-project-feed"
version = "0.1.0"
description = "Nightly Mountain Project 'What's New' feed for one area, written as JSON for Home Assistant"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "defusedxml>=0.7",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
mountain-project-feed = "mpfeed.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mpfeed"]
