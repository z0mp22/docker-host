- sensor:
    name: Plex Recordings Status
    unique_id: plex_recordings_status_file
    command: >-
      python3 -c "import json,re; d=json.load(open('/config/plex_recordings_state.json')); s=d.get('status','unknown'); print(re.sub(r'[\x00-\x1f<>]','',str(s)).strip())"
    scan_interval: 30
    icon: mdi:television-classic

- sensor:
    name: Plex Recording Last Event
    unique_id: plex_recording_last_event_file
    command: >-
      python3 -c "import json,re; d=json.load(open('/config/plex_recordings_state.json')); s=d.get('last_scheduled','None queued'); print(re.sub(r'[\x00-\x1f<>]','',str(s)).strip())"
    scan_interval: 30
    icon: mdi:record-rec

- sensor:
    name: Plex Recording Last Completed
    unique_id: plex_recording_last_completed_file
    command: >-
      python3 -c "import json,re; d=json.load(open('/config/plex_recordings_state.json')); s=d.get('last_completed','None yet'); print(re.sub(r'[\x00-\x1f<>]','',str(s)).strip())"
    scan_interval: 30
    icon: mdi:check-circle

- sensor:
    name: Plex Recordings Sync Meta
    unique_id: plex_recordings_sync_meta_file
    command: cat /config/plex_recordings_state.json
    scan_interval: 30
    value_template: "{{ value_json.ran_at | default(value_json.status, true) | default('unknown') }}"
    json_attributes:
      - scheduled
      - skipped_existing
      - plex_queue
      - errors
      - ran_at
      - matched
      - status
      - last_scheduled
      - last_completed
      - recent_recordings
      - completed_recent
      - health
      - awaiting_index_count
      - library_healthy
      - disk

# Numeric disk entities for gauge / mushroom entity cards (from MQTT bridge JSON).
- sensor:
    name: Plex Recordings Disk Used
    unique_id: plex_recordings_disk_used_percent
    command: >-
      python3 -c "import json; d=(json.load(open('/config/plex_recordings_state.json')).get('disk') or {}); v=d.get('filesystem_used_percent'); print(v if v is not None else 'unknown')"
    scan_interval: 30
    unit_of_measurement: "%"
    state_class: measurement
    icon: mdi:harddisk

- sensor:
    name: Plex Recordings Disk Free
    unique_id: plex_recordings_disk_free_gb
    command: >-
      python3 -c "import json; d=(json.load(open('/config/plex_recordings_state.json')).get('disk') or {}); v=d.get('filesystem_avail_gb'); print(v if v is not None else 'unknown')"
    scan_interval: 30
    unit_of_measurement: GiB
    state_class: measurement
    device_class: data_size
    icon: mdi:harddisk

- sensor:
    name: Plex Recordings Library Size
    unique_id: plex_recordings_library_size_gb
    command: >-
      python3 -c "import json; d=(json.load(open('/config/plex_recordings_state.json')).get('disk') or {}); v=d.get('recordings_gb'); print(v if v is not None else 'unknown')"
    scan_interval: 30
    unit_of_measurement: GiB
    state_class: measurement
    device_class: data_size
    icon: mdi:folder-play

# HDHomeRun tuner signal (opportunistic -- only updates while a tuner is
# actively in use for a recording or live TV; see plex_recordings
# scripts/publish_hdhomerun_signal.py and docs/decisions/0002-*.md here).
- sensor:
    name: HDHomeRun Signal Strength
    unique_id: hdhomerun_signal_strength_percent
    command: >-
      python3 -c "import json; d=json.load(open('/config/hdhomerun_signal_state.json')); v=d.get('signal_strength_percent'); print(v if v is not None else 'unknown')"
    scan_interval: 30
    unit_of_measurement: "%"
    state_class: measurement
    icon: mdi:signal

- sensor:
    name: HDHomeRun Signal Quality
    unique_id: hdhomerun_signal_quality_percent
    command: >-
      python3 -c "import json; d=json.load(open('/config/hdhomerun_signal_state.json')); v=d.get('signal_quality_percent'); print(v if v is not None else 'unknown')"
    scan_interval: 30
    unit_of_measurement: "%"
    state_class: measurement
    icon: mdi:signal-cellular-3

- sensor:
    name: HDHomeRun Symbol Quality
    unique_id: hdhomerun_symbol_quality_percent
    command: >-
      python3 -c "import json; d=json.load(open('/config/hdhomerun_signal_state.json')); v=d.get('symbol_quality_percent'); print(v if v is not None else 'unknown')"
    scan_interval: 30
    unit_of_measurement: "%"
    state_class: measurement
    icon: mdi:waveform

- sensor:
    name: HDHomeRun Signal Meta
    unique_id: hdhomerun_signal_meta_file
    command: cat /config/hdhomerun_signal_state.json
    scan_interval: 30
    value_template: "{{ value_json.channel_name | default(value_json.channel, true) | default('idle', true) }}"
    json_attributes:
      - updated_at
      - channel
      - channel_name
      - signal_strength_percent
      - signal_quality_percent
      - symbol_quality_percent
      - weather_condition
      - weather_temperature
      - readings

# Lift session (garmin-coaching-report/coaching_report/lift_main.py writes
# lift_session_latest.json to REPORT_OUTPUT_DIR; run-lift-session.sh copies
# it here after each successful, non-dry-run generation -- same shape as the
# Plex/HDHomeRun bridges above, just triggered at the end of that script
# instead of on a cron).
- sensor:
    name: Lift Session Latest
    unique_id: lift_session_latest_file
    command: cat /config/lift_session_state.json
    scan_interval: 30
    value_template: "{{ value_json.session_date | default('none yet', true) }}"
    json_attributes:
      - session_date
      - generated_at
      - rationale
      - summary_text
      - exercise_count
      - flags_considered
      - routine_id
      - session_type
      - model

# Internet latency for the Network panel, measured from the Pi itself so it works
# even when UniFi data doesn't. Prints {"avg": <ms or null>, "loss": <percent>};
# the sensor goes unavailable (not 0 ms) when nothing answers.
- sensor:
    name: Internet latency Cloudflare
    unique_id: net_latency_cloudflare
    command: |-
      ping -c 3 -W 2 -q 1.1.1.1 2>/dev/null | awk '/packet loss/ {for (i = 1; i <= NF; i++) if ($i ~ /%$/) loss = $i} /min\/avg\/max/ {split($0, p, "="); split(p[2], r, "/"); avg = r[2] + 0} END {sub("%", "", loss); printf "{\"avg\": %s, \"loss\": %s}\n", (avg == "" ? "null" : avg), (loss == "" ? 100 : loss)}'
    scan_interval: 60
    unit_of_measurement: ms
    state_class: measurement
    availability: "{{ value_json is defined and value_json.avg is not none }}"
    value_template: "{{ value_json.avg }}"
    json_attributes:
      - loss
- sensor:
    name: Internet latency Google
    unique_id: net_latency_google
    command: |-
      ping -c 3 -W 2 -q 8.8.8.8 2>/dev/null | awk '/packet loss/ {for (i = 1; i <= NF; i++) if ($i ~ /%$/) loss = $i} /min\/avg\/max/ {split($0, p, "="); split(p[2], r, "/"); avg = r[2] + 0} END {sub("%", "", loss); printf "{\"avg\": %s, \"loss\": %s}\n", (avg == "" ? "null" : avg), (loss == "" ? 100 : loss)}'
    scan_interval: 60
    unit_of_measurement: ms
    state_class: measurement
    availability: "{{ value_json is defined and value_json.avg is not none }}"
    value_template: "{{ value_json.avg }}"
    json_attributes:
      - loss
