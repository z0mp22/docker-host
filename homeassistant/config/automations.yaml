- id: '1769900000001'
  alias: Plex recording scheduled
  description: Push to mobile when plex_recordings books a new OTA recording
  triggers:
  - trigger: mqtt
    topic: home/plex_recordings/events/scheduled
  conditions:
  - condition: template
    value_template: >-
      {% set p = trigger.payload_json
         if trigger.payload_json is defined
         else trigger.payload | from_json(default={}) %}
      {{ (p.get('message') or p.get('title') or p.get('show')) | length > 0 }}
  actions:
  - action: script.notify_mobile_recording
    data:
      title: Recording scheduled
      message: >-
        {% set p = trigger.payload_json
           if trigger.payload_json is defined
           else trigger.payload | from_json(default={}) %}
        {{ p.get('message') or (
             (p.get('show') ~ ' — ' ~ p.get('title') if p.get('show') and p.get('title') else p.get('title') or p.get('show'))
             ~ ('\nAirs ' ~ (as_timestamp(p.air_time) | timestamp_custom('%a %b %d, %I:%M %p')) if p.get('air_time') else '')
           ) }}
  mode: queued
  max: 5
- id: '1769900000002'
  alias: Plex recording completed
  description: Push to mobile when a team recording lands in the Plex library
  triggers:
  - trigger: mqtt
    topic: home/plex_recordings/events/completed
  conditions:
  - condition: template
    value_template: >-
      {% set p = trigger.payload_json
         if trigger.payload_json is defined
         else trigger.payload | from_json(default={}) %}
      {{ (p.get('message') or p.get('title') or p.get('show')) | length > 0 }}
  actions:
  - action: script.notify_mobile_recording
    data:
      title: Recording ready
      message: >-
        {% set p = trigger.payload_json
           if trigger.payload_json is defined
           else trigger.payload | from_json(default={}) %}
        {{ p.get('message') or (
             'Ready to watch: ' ~ (p.get('show') ~ ' — ' ~ p.get('title') if p.get('show') and p.get('title') else p.get('title') or p.get('show'))
           ) }}
  mode: queued
  max: 5
- id: '1753398000001'
  alias: Plex recordings library unhealthy
  description: >
    Alert when plex_recordings sync reports a bad library type or files on disk
    that are not visible in Plex (the old movie-library / awaiting-index failure).
  triggers:
  - trigger: state
    entity_id: sensor.plex_recordings_sync_meta
  - trigger: homeassistant
    event: start
  conditions:
  - condition: template
    value_template: >
      {% set awaiting = state_attr('sensor.plex_recordings_sync_meta', 'awaiting_index_count') | int(0) %}
      {% set healthy = state_attr('sensor.plex_recordings_sync_meta', 'library_healthy') %}
      {{ healthy in [false, 'false', False] or awaiting > 0 }}
  actions:
  - action: persistent_notification.create
    data:
      title: Plex recordings unhealthy
      notification_id: plex_recordings_unhealthy
      message: >
        {% set awaiting = state_attr('sensor.plex_recordings_sync_meta', 'awaiting_index_count') | int(0) %}
        {% set health = state_attr('sensor.plex_recordings_sync_meta', 'health') or {} %}
        {% set issues = health.get('issues') if health is mapping else [] %}
        Library healthy={{ state_attr('sensor.plex_recordings_sync_meta', 'library_healthy') }},
        awaiting index={{ awaiting }}.
        {% if issues %} {{ issues[0] }}{% endif %}
        Check Recordings dashboard or run heal_recordings_library.sh on media-laptop.
  - action: script.notify_mobile_recording
    data:
      title: Plex recordings unhealthy
      message: >
        {% set awaiting = state_attr('sensor.plex_recordings_sync_meta', 'awaiting_index_count') | int(0) %}
        {% set health = state_attr('sensor.plex_recordings_sync_meta', 'health') or {} %}
        {% set issues = health.get('issues') if health is mapping else [] %}
        awaiting={{ awaiting }} · {{ issues[0] if issues else states('sensor.plex_recordings_status') }}
  mode: single
- id: '1753398000002'
  alias: Clear Plex recordings unhealthy notification
  description: Dismiss the persistent alert once sync reports a healthy library again.
  triggers:
  - trigger: state
    entity_id: sensor.plex_recordings_sync_meta
  conditions:
  - condition: template
    value_template: >
      {% set awaiting = state_attr('sensor.plex_recordings_sync_meta', 'awaiting_index_count') | int(0) %}
      {% set healthy = state_attr('sensor.plex_recordings_sync_meta', 'library_healthy') %}
      {{ healthy not in [false, 'false', False] and awaiting == 0 }}
  actions:
  - action: persistent_notification.dismiss
    data:
      notification_id: plex_recordings_unhealthy
  mode: single
