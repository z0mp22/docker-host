# Garage door left open at night, seen by the Garage camera (there is no door sensor).
# Frigate's state-classification model "garage_door" (frigate repo config.yml,
# classification.custom) crops the top of the door opening and labels it open/closed;
# the Frigate integration exposes that as sensor.garage_garage_garage_door_classification.
# - Frigate only publishes a verified change (3 matching classifications in a row) and doesn't
#   retain it; the integration restores the last value across HA restarts.
# - It reads "Unknown" until the model is trained and the door first changes state after the
#   sensor is created; these automations stay quiet until then.
# - A dropped camera stream freezes the sensor at its last value, so the 21:00 check pushes
#   "can't check" when the Garage stream is down instead of trusting it.

# The classifier's nightly retraining (frigate repo, .github/workflows/garage-door-trainer.yml)
# publishes a retained status after every run: state training / stopped (the model is reliable) /
# ended (hit its end date), plus a ready-made weekly message and what conditions it hasn't seen yet.
mqtt:
  sensor:
    - name: Garage door trainer
      unique_id: garage_door_trainer_status
      state_topic: home/garage_door_trainer/status
      value_template: "{{ value_json.state }}"
      json_attributes_topic: home/garage_door_trainer/status
      icon: mdi:school-outline

automation:
  - id: garage_door_open_at_night
    alias: "Garage: push when the door is open at night"
    description: >-
      At 21:00, or after the door has been open 10 minutes between 21:00 and 06:00, push a
      Garage camera photo. Closing the door clears the push.
    mode: single
    triggers:
      - trigger: time
        at: "21:00:00"
        id: check
      - trigger: state
        entity_id: sensor.garage_garage_garage_door_classification
        to: open
        for: "00:10:00"
        id: opened
    conditions:
      - condition: time
        after: "21:00:00"
        before: "06:00:00"
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.garage_stream_active
                state: "on"
              - condition: state
                entity_id: sensor.garage_garage_garage_door_classification
                state: open
            sequence:
              - action: script.notify_phones
                data:
                  title: Garage door is open
                  message: "Open since {{ as_local(states.sensor.garage_garage_garage_door_classification.last_changed).strftime('%-I:%M %p') }}"
                  tag: garage-door-open
                  channel: Garage
                  data:
                    image: "/api/camera_proxy/camera.garage?v={{ now().timestamp() | int }}"
                    clickAction: /cameras?live=camera.garage
                    url: /cameras?live=camera.garage
          - conditions:
              - condition: trigger
                id: check
              - condition: template
                value_template: >-
                  {{ not is_state('binary_sensor.garage_stream_active', 'on')
                     and states('sensor.garage_garage_garage_door_classification') | lower != 'unknown' }}
            sequence:
              - action: script.notify_phones
                data:
                  title: Can't check the garage door
                  message: The Garage camera stream is down, so the door state is stale.
                  tag: garage-door-unknown
                  channel: Garage

  - id: garage_door_closed_clear
    alias: "Garage: clear the open-door push when it closes"
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.garage_garage_garage_door_classification
        from: open
        to: closed
    actions:
      - action: script.notify_phones
        data:
          message: clear_notification
          tag: garage-door-open

  - id: garage_door_trainer_weekly
    alias: "Garage: weekly push on how the door model's training is going"
    description: >-
      Sundays at 9:00 while it's still training. If the job hasn't reported for 2 days, say that
      instead (the minipc runner or the workflow stopped).
    mode: single
    triggers:
      - trigger: time
        at: "09:00:00"
    conditions:
      - condition: time
        weekday: sun
      - condition: state
        entity_id: sensor.garage_door_trainer
        state: training
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ as_datetime(state_attr('sensor.garage_door_trainer', 'updated')) is not none
                     and now() - as_datetime(state_attr('sensor.garage_door_trainer', 'updated')) > timedelta(days=2) }}
            sequence:
              - action: script.notify_phones
                data:
                  title: Garage door model isn't training
                  message: >-
                    The nightly retraining last reported
                    {{ as_local(as_datetime(state_attr('sensor.garage_door_trainer', 'updated'))).strftime('%a %b %-d') }}.
                    Check the "Garage door trainer" workflow in the frigate repo.
                  tag: garage-door-trainer-stale
                  channel: Garage
        default:
          - action: script.notify_phones
            data:
              title: Garage door model this week
              message: "{{ state_attr('sensor.garage_door_trainer', 'message') }}"
              tag: garage-door-trainer-weekly
              channel: Garage

  - id: garage_door_trainer_finished
    alias: "Garage: push when the door model's training stops"
    description: Once, when the trainer reports stopped (reliable) or ended (hit its end date).
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.garage_door_trainer
        from: training
        to:
          - stopped
          - ended
    actions:
      - action: script.notify_phones
        data:
          title: "{{ 'Garage door model is trained' if trigger.to_state.state == 'stopped' else 'Garage door training ended' }}"
          message: "{{ state_attr('sensor.garage_door_trainer', 'message') }}"
          tag: garage-door-trainer-done
          channel: Garage
