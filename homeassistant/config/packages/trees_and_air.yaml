  # --- Outdoor air / activity ---
  outdoor_aqi_good:
    name: "Outdoor: AQI at or below this scores 100"
    min: 0
    max: 200
    step: 1
    mode: box
    icon: mdi:air-filter
  outdoor_aqi_zero:
