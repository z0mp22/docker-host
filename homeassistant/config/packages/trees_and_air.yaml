# Trees watering decision + outdoor air/activity score.
#
# PROJECT 1 - young trees (Hot Wings Tatarian Maple, Sensation Boxelder Maple, planted 2026-09-12)
#   Daily "water today / skip" with a plain-English reason, a push notification at a chosen
#   time, and a Home dashboard card.
#   Guidance sources:
#   - CSU Extension Fact Sheet 7.211 "Fall and Winter Watering" (Klett & Cox, reviewed Aug 2025):
#     water only when air is above 40 F, at midday so it soaks in before a night freeze, only
#     without snow cover, about once or twice a month in dry spells; 10 gal per inch of trunk
#     diameter, soaked to ~12 in. Maples are on its list of shallow-rooted trees that need it.
#   - CSU Extension GardenNotes #635 "Care of Recently Planted Trees" (rev. Aug 2024): daily for
#     the first weeks, every 2-3 days for several months, then weekly; ~1-1.5 gal per inch of
#     caliper per irrigation; check soil first (clay soils are easy to overwater); in winter,
#     water monthly on sunny days above 40 F when the ground is not frozen.
#   - City of Fort Collins voluntary Water Shortage Watch (declared 2026-05-01, still in effect
#     as of 2026-10-03): no watering 10 AM-6 PM, lawns 2 days/week, ~1 in/week; it explicitly
#     asks residents to keep prioritising trees with careful hand or drip watering.
#   Data: Open-Meteo REST (past rainfall, soil temperature, snow depth: the core Open-Meteo
#   integration exposes none of these) and the NWS integration (overnight lows / first freeze).
#
# PROJECT 2 - smoke and air gate
#   0-100 outdoor activity score with a green/yellow/red level.
#   - AirNow integration: official AQI (NowCast).
#   - PurpleAir REST: the core PurpleAir integration only reads the API's default pm2.5 field
#     (the ATM channel for outdoor sensors), but EPA's correction needs CF=1 per channel, so
#     A/B CF=1 and humidity come from the API directly. Correction: EPA extended US-wide
#     correction, Barkjohn et al. 2022 (Sensors 22:9669):
#       PA < 570:        0.524*PA - 0.0862*RH + 5.75     (RH = PurpleAir's own humidity)
#       570 <= PA <= 611: linear blend, w = 0.0244*PA - 13.9
#       PA > 611:        4.21e-4*PA^2 + 0.392*PA + 3.44
#     QC: A and B must agree within 5 ug/m3 or 70%, else the reading is dropped.
#     AQI uses EPA's 2024 PM2.5 breakpoints (9.0 / 35.4 / 55.4 / 125.4 / 225.4).
#   - NWS integration: wind gust and RH as secondary inputs (RH also backfills the
#     correction if the PurpleAir humidity is missing).
#   - Climbing and riding scores are placeholders to be wired up later.
#
# Every threshold is a helper. Defaults are set once by "Trees & air: apply default settings"
# (helpers restore their own value across restarts, so `initial:` would wipe UI tuning).

