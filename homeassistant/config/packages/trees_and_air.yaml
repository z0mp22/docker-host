  trees_dry_spell_days:
    name: "Trees: dry spell length for winter watering"
    min: 3
    max: 60
    step: 1
    unit_of_measurement: days
    mode: box
    icon: mdi:weather-sunny-alert
  trees_snow_cover_in:
    name: "Trees: snow cover at or above"
    min: 0
    max: 12
    step: 0.25
