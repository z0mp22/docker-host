# Claude looks at camera photos so phone alerts carry things the detectors can't name:
# - Porch: the T8210 doorbell never reports package events, so Claude checks Eufy's picture of
#   each person detection. The battery doorbell is asleep between events, so that picture is the
#   only fresh view of the porch (camera.doorbell also serves it).
# - Wildlife: Frigate's COCO model has no deer/raccoon/fox class. Deer come through as
#   horse/cow/sheep and raccoons/foxes as cat/dog/bear, so Claude names the animal and only
#   wild ones are pushed (the household golden retriever is a Driveway "dog" too).
# Both use ai_task.claude_ai_task from the Anthropic integration (added in the UI 2026-10-11,
# set to claude-sonnet-5 with thinking off). Haiku 4.5 called a leashed dog with two walkers
# a raccoon or coyote; Sonnet got it right. Without the integration these stop at their
# first condition.

# Porch state for the phone alerts and the /house "Needs attention" rows. camera.porch_package is a
# Local File camera (added in the UI, like camera.doorbell_ring) showing /config/doorbell/package.jpg:
# the package when it arrived, or whoever was there when it went missing.
input_boolean:
  porch_package_present:
    name: Package on the porch
    icon: mdi:package-variant-closed
  porch_package_taken:
    name: Package gone while nobody was home
    icon: mdi:package-variant-closed-remove

input_datetime:
  porch_package_at:
    name: Porch package arrived or went missing
    has_date: true
    has_time: true

input_text:
  porch_package_note:
    name: Porch package description
    max: 255

script:
  porch_package_brought_in:
    alias: "Porch: I brought the package in"
    icon: mdi:package-variant-closed-check
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: [input_boolean.porch_package_present, input_boolean.porch_package_taken]
      - action: script.notify_phones
        data:
          message: clear_notification
          tag: porch-package
      - action: script.notify_phones
        data:
          message: clear_notification
          tag: porch-package-taken

  porch_package_dismiss_taken:
    alias: "Porch: dismiss the missing-package alert"
    icon: mdi:close
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.porch_package_taken
      - action: script.notify_phones
        data:
          message: clear_notification
          tag: porch-package-taken

automation:
  - id: porch_package_check
    alias: "Porch: check each doorbell person picture for a package"
    description: >-
      Claude looks at the doorbell's picture of each person detection. A new package pushes the
      photo; a later clear view without one clears it, and if nobody is home that's a
      "package gone" alert with the picture of whoever was there.
    mode: restart
    triggers:
      - trigger: state
        entity_id: event.doorbell_detection
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none
             and trigger.from_state.state != 'unavailable'
             and trigger.to_state.attributes.event_type == 'person' }}
      - condition: template
        value_template: "{{ expand('ai_task.claude_ai_task') | count > 0 }}"
    actions:
      # The event picture lands shortly after the detection event.
      - wait_for_trigger:
          - trigger: state
            entity_id: image.doorbell_last_event
        timeout: "00:01:00"
      - action: ai_task.generate_data
        response_variable: seen
        data:
          entity_id: ai_task.claude_ai_task
          task_name: porch package check
          instructions: >-
            This is a doorbell camera photo of a front porch, taken when someone walked up.
            Is a delivered package, parcel, box, padded mailer or grocery/food delivery bag
            sitting on the porch, steps or doormat, or being set down there by a delivery
            worker? Ignore furniture, plants, decorations and bins.
          structure:
            package:
              description: True only if a delivered item is clearly visible
              required: true
              selector:
                boolean:
            view_blocked:
              description: >-
                True if a person or object hides the porch floor, steps or doormat, so a
                package there might not be visible
              required: true
              selector:
                boolean:
            description:
              description: Under 12 words, e.g. "Brown box left of the door"
              required: true
              selector:
                text:
          attachments:
            - media_content_id: media-source://image/image.doorbell_last_event
              media_content_type: image/jpeg
      - variables:
          # Both must say "away"; an unknown or unavailable presence never raises a theft alert.
          nobody_home: >-
            {{ states('person.cody') not in ['home', 'unknown', 'unavailable']
               and is_state('binary_sensor.tiffany_home', 'off') }}
      - choose:
          - conditions: "{{ seen.data.package and is_state('input_boolean.porch_package_present', 'off') }}"
            sequence:
              - action: camera.snapshot
                target:
                  entity_id: camera.doorbell
                data:
                  filename: /config/doorbell/package.jpg
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.porch_package_at
                data:
                  timestamp: "{{ now().timestamp() }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.porch_package_note
                data:
                  value: "{{ seen.data.description[:255] }}"
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.porch_package_taken
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.porch_package_present
              - action: script.notify_phones
                data:
                  title: Package at the front door
                  message: "{{ seen.data.description }} · {{ now().strftime('%-I:%M %p') }}"
                  tag: porch-package
                  channel: Porch
                  data:
                    image: "/api/camera_proxy/camera.porch_package?v={{ now().timestamp() | int }}"
                    clickAction: /house
                    url: /house
          - conditions: >-
              {{ not seen.data.package and not seen.data.view_blocked
                 and is_state('input_boolean.porch_package_present', 'on') }}
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.porch_package_present
              - action: script.notify_phones
                data:
                  message: clear_notification
                  tag: porch-package
              - if:
                  - condition: template
                    value_template: "{{ nobody_home }}"
                then:
                  # Keep the picture of whoever was there; it replaces the package photo.
                  - action: camera.snapshot
                    target:
                      entity_id: camera.doorbell
                    data:
                      filename: /config/doorbell/package.jpg
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.porch_package_at
                    data:
                      timestamp: "{{ now().timestamp() }}"
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.porch_package_taken
                  - action: script.notify_phones
                    data:
                      title: Package gone while nobody's home
                      message: >-
                        {{ states('input_text.porch_package_note') or 'The package' }} is no longer
                        on the porch · {{ now().strftime('%-I:%M %p') }}. This is who was there.
                      tag: porch-package-taken
                      channel: Security
                      data:
                        image: "/api/camera_proxy/camera.porch_package?v={{ now().timestamp() | int }}"
                        clickAction: /house
                        url: /house

  - id: wildlife_driveway_alert
    alias: "Wildlife: push when Claude confirms a wild animal on the Driveway"
    description: >-
      Frigate's first sighting of a horse/cow/sheep/bear/cat/dog on the Driveway gets a live frame
      checked by Claude; only wild animals are pushed, one alert per species.
    mode: queued
    max: 3
    triggers:
      - trigger: mqtt
        topic: frigate/events
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.payload_json.type == 'new'
             and trigger.payload_json.after.camera == 'Driveway'
             and trigger.payload_json.after.label in ['horse', 'cow', 'sheep', 'bear', 'cat', 'dog'] }}
      - condition: template
        value_template: "{{ expand('ai_task.claude_ai_task') | count > 0 }}"
    actions:
      - variables:
          event_id: "{{ trigger.payload_json.after.id }}"
          frigate_label: "{{ trigger.payload_json.after.label }}"
      - action: ai_task.generate_data
        response_variable: seen
        data:
          entity_id: ai_task.claude_ai_task
          task_name: driveway wildlife check
          instructions: >-
            This is a driveway security camera frame (possibly infrared at night) in Fort
            Collins, Colorado. The object detector thinks it saw a {{ frigate_label }}. Is there a
            wild animal in the frame, such as a deer, raccoon, fox, coyote, skunk, bear, rabbit or
            mountain lion? Pets (dogs, house cats), people, vehicles and birds are not wild animals.
            A dog on a leash or walking with people is a pet. If the animal is too small or unclear
            to identify, answer false.
          structure:
            wild:
              description: True only if a wild mammal is visible
              required: true
              selector:
                boolean:
            animal:
              description: Common name in lowercase, e.g. "mule deer", "raccoon"; empty if none
              required: true
              selector:
                text:
          attachments:
            - media_content_id: media-source://camera/camera.driveway
              media_content_type: image/jpeg
      - condition: template
        value_template: "{{ seen.data.wild and seen.data.animal | length > 0 }}"
      - action: script.notify_phones
        data:
          title: "{{ seen.data.animal | capitalize }} on the driveway"
          message: "Frigate saw a {{ frigate_label }} · {{ now().strftime('%-I:%M %p') }}"
          # Per species, so a second deer replaces the first alert instead of stacking.
          tag: "wildlife-{{ seen.data.animal | slugify }}"
          channel: Wildlife
          data:
            image: "/api/frigate/notifications/{{ event_id }}/snapshot.jpg"
            clickAction: /wildlife
            url: /wildlife
