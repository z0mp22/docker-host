# Basement workout: one tap sets the basement up so it's ready by the time Cody walks down.
# Lights to 35%, and the Roku opens Spotify straight into the workout playlist (the TV wakes over
# HDMI-CEC). The button is on the Coaching panel (/coach, Basement card); the script also works
# from the companion app or a home-screen shortcut.
#
# The playlist starts through a Roku ECP deep link into the Spotify app (22297), tested live on the
# basement Roku on 2026-10-05: it starts the playlist from the home screen and from inside Spotify,
# about 5 s after the request. Two details matter:
# - The content id has to be URL-encoded (spotify%3Aplaylist%3A...); with literal colons the Roku
#   answers 404.
# - The param is contentId. HA's roku.play_media sends contentID, which hasn't been tested with
#   Spotify, so this calls ECP directly with the exact request that worked.
# No Spotify account link or developer app is involved.
#
# End workout (same card, added 2026-10-11): Home closes Spotify (a Roku app can't keep playing in the
# background), PowerOff puts the Roku in standby, the TV is turned off directly (added 2026-10-22; it used
# to rely on following the Roku over HDMI-CEC), lights off, then a
# push asks how it went. The push has an inline Reply: the text goes straight into the coach feedback
# log (script.lift_feedback_submit), and the push clears itself once feedback is logged, from the push or
# the Coach panel. Tapping the push opens /coach?feedback with the feedback box focused. "Felt good" and
# "Too hard" log a one-tap answer, naming which of today's coach sessions it was about.

rest_command:
  basement_roku_workout_playlist:
    url: "http://10.0.0.188:8060/launch/22297?contentId=spotify%3Aplaylist%3A3DwsyvJJdqUFu9hk73jwkA&mediaType=playlist"
    method: post
    # Without this, HA's URL handling (yarl) decodes %3A back to ":" and the Roku answers 404.
    skip_url_encoding: true
    timeout: 10

script:
  basement_workout:
    alias: "Basement: workout"
    description: Basement lights to 35% and the workout playlist on the basement Roku.
    icon: mdi:dumbbell
    mode: single
    sequence:
      # A light problem shouldn't stop the music.
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id: light.basement
        data:
          brightness_pct: 35
      - action: rest_command.basement_roku_workout_playlist
        response_variable: roku
      - if:
          - condition: template
            value_template: "{{ roku.status != 200 }}"
        then:
          - stop: "The basement Roku didn't start Spotify"
            error: true

  basement_workout_end:
    alias: "Basement: end workout"
    description: Spotify closed, basement Roku and TV off, lights off, then a push asking how it went.
    icon: mdi:stop-circle-outline
    mode: single
    sequence:
      # Each step is independent: a Roku that's already off shouldn't keep the lights on.
      - action: remote.send_command
        continue_on_error: true
        target:
          entity_id: remote.basement_roku
        data:
          command: home
      - delay:
          seconds: 2
      - action: media_player.turn_off
        continue_on_error: true
        target:
          entity_id: media_player.basement_roku
      # The TV directly too (packages/basement_tv.yaml), so it doesn't depend on CEC following the Roku.
      - action: media_player.turn_off
        continue_on_error: true
        target:
          entity_id: media_player.basement_tv
      - action: light.turn_off
        continue_on_error: true
        target:
          entity_id: light.basement
      - action: script.notify_phones
        data:
          title: How did the workout go?
          message: Reply here and it goes straight to the coach.
          tag: workout-feedback
          channel: Coach
          data:
            clickAction: /coach?feedback
            url: /coach?feedback
            # Two one-tap answers, then REPLY (the Companion app's inline text reply). Android shows 3 at most.
            actions:
              - action: WORKOUT_FB_GOOD
                title: Felt good
              - action: WORKOUT_FB_HARD
                title: Too hard
              - action: REPLY
                title: Reply

automation:
  - id: workout_feedback_reply
    alias: "Workout: log the reply to the end-of-workout push as coach feedback"
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: REPLY
    conditions:
      # Only this push has a Reply action today; the tag check keeps it that way if another one is added.
      - condition: template
        value_template: "{{ (trigger.event.data.tag | default('workout-feedback', true)) == 'workout-feedback' }}"
      - condition: template
        value_template: "{{ (trigger.event.data.reply_text | default('', true) | trim) != '' }}"
    actions:
      - action: input_text.set_value
        target:
          entity_id: input_text.lift_feedback
        data:
          value: "{{ (trigger.event.data.reply_text | trim)[:255] }}"
      - action: script.lift_feedback_submit
        data:
          source: push
    mode: queued

  - id: workout_feedback_quick
    alias: "Workout: log a one-tap answer from the end-of-workout push"
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: WORKOUT_FB_GOOD
        id: Felt good
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: WORKOUT_FB_HARD
        id: Too hard
    actions:
      - variables:
          today: "{{ now().date().isoformat() }}"
          done: >-
            {{ (['lift'] if states('sensor.lift_session_latest') == today else [])
               + (['board'] if states('sensor.fingerboard_session_latest') == today else []) }}
      - action: input_text.set_value
        target:
          entity_id: input_text.lift_feedback
        data:
          value: >-
            {{ trigger.id }}{{ " (today's " ~ (done | join(' + ')) ~ ' session)' if done else '' }}.
      - action: script.lift_feedback_submit
        data:
          source: push
    mode: queued
