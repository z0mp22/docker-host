- sensor:
    - name: Living Room Now Playing
      unique_id: living_room_now_playing
      icon: mdi:television
      state: >
        {% set roku = 'media_player.z_roku_ultra' %}
        {% set preferred = ['media_player.plex_plex_for_roku_z_roku_ultra'] %}
        {% set ns = namespace(plex='') %}
        {% for entity_id in preferred %}
          {% if states(entity_id) not in ['unavailable', 'unknown', 'none']
             and (is_state(entity_id, 'playing') or is_state(entity_id, 'paused')) %}
            {% set ns.plex = entity_id %}
          {% endif %}
        {% endfor %}
        {% if not ns.plex %}
          {% for entity in states.media_player %}
            {% if entity.entity_id.startswith('media_player.plex_')
               and ('z_roku' in entity.entity_id or 'roku_ultra' in entity.entity_id)
               and (is_state(entity.entity_id, 'playing') or is_state(entity.entity_id, 'paused')) %}
              {% set ns.plex = entity.entity_id %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {% if not ns.plex and (is_state(roku, 'playing') or is_state(roku, 'paused')) %}
          {% if 'plex' in (state_attr(roku, 'app_name') | default('') | lower) %}
            {% for entity in states.media_player %}
              {% if entity.entity_id.startswith('media_player.plex_')
                 and (is_state(entity.entity_id, 'playing') or is_state(entity.entity_id, 'paused')) %}
                {% set ns.plex = entity.entity_id %}
              {% endif %}
            {% endfor %}
          {% endif %}
        {% endif %}
        {% if ns.plex %}
          {% if state_attr(ns.plex, 'media_content_type') == 'tvshow' %}
            {{ state_attr(ns.plex, 'media_series_title') }} S{{ state_attr(ns.plex, 'media_season') }}E{{ state_attr(ns.plex, 'media_episode') }} · {{ state_attr(ns.plex, 'media_title') }}
          {% else %}
            {{ state_attr(ns.plex, 'media_title') | default('Plex') }}
          {% endif %}
        {% elif is_state(roku, 'playing') or is_state(roku, 'paused') %}
          {{ state_attr(roku, 'app_name') | default(states(roku)) }}
        {% elif states(roku) not in ['unavailable', 'unknown'] %}
          Idle
        {% else %}
          Unavailable
        {% endif %}
      attributes:
        plex_entity: >
          {% set ns = namespace(id='') %}
          {% for entity in states.media_player %}
            {% if entity.entity_id.startswith('media_player.plex_')
               and ('z_roku' in entity.entity_id or 'roku_ultra' in entity.entity_id)
               and states(entity.entity_id) not in ['unavailable', 'unknown'] %}
              {% set ns.id = entity.entity_id %}
            {% endif %}
          {% endfor %}
          {{ ns.id }}

    - name: Basement Now Playing
      unique_id: basement_now_playing
      icon: mdi:television
      state: >
        {% set roku = 'media_player.basement_roku' %}
        {% set preferred = ['media_player.plex_plex_for_roku_basement_roku'] %}
        {% set ns = namespace(plex='') %}
        {% for entity_id in preferred %}
          {% if states(entity_id) not in ['unavailable', 'unknown', 'none']
             and (is_state(entity_id, 'playing') or is_state(entity_id, 'paused')) %}
            {% set ns.plex = entity_id %}
          {% endif %}
        {% endfor %}
        {% if not ns.plex %}
          {% for entity in states.media_player %}
            {% if entity.entity_id.startswith('media_player.plex_')
               and 'basement' in entity.entity_id
               and (is_state(entity.entity_id, 'playing') or is_state(entity.entity_id, 'paused')) %}
              {% set ns.plex = entity.entity_id %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {% if ns.plex %}
          {% if state_attr(ns.plex, 'media_content_type') == 'tvshow' %}
            {{ state_attr(ns.plex, 'media_series_title') }} S{{ state_attr(ns.plex, 'media_season') }}E{{ state_attr(ns.plex, 'media_episode') }} · {{ state_attr(ns.plex, 'media_title') }}
          {% else %}
            {{ state_attr(ns.plex, 'media_title') | default('Plex') }}
          {% endif %}
        {% elif is_state(roku, 'playing') or is_state(roku, 'paused') %}
          {{ state_attr(roku, 'app_name') | default(states(roku)) }}
        {% elif states(roku) not in ['unavailable', 'unknown'] %}
          Idle
        {% else %}
          Unavailable
        {% endif %}
      attributes:
        plex_entity: >
          {% set ns = namespace(id='') %}
          {% for entity in states.media_player %}
            {% if entity.entity_id.startswith('media_player.plex_')
               and 'basement' in entity.entity_id
               and states(entity.entity_id) not in ['unavailable', 'unknown'] %}
              {% set ns.id = entity.entity_id %}
            {% endif %}
          {% endfor %}
          {{ ns.id }}

    - name: Irrigation Next Run
      unique_id: irrigation_next_run
      icon: mdi:calendar-clock
      state: >
        {% if is_state('binary_sensor.opensprinkler_rain_delay_active', 'on')
           and states('sensor.opensprinkler_rain_delay_stop_time') not in ['unknown', 'unavailable', 'none', ''] %}
          Rain delay until {{ as_timestamp(states('sensor.opensprinkler_rain_delay_stop_time')) | timestamp_custom('%b %d, %H:%M') }}
        {% else %}
          {% set ns = namespace(name='', days=999, time='') %}
          {% for e in states.number if 'starting_in_days' in e.entity_id %}
            {% set base = e.entity_id | replace('number.', '') | replace('_starting_in_days', '') %}
            {% set enabled = 'switch.' ~ base ~ '_program_enabled' %}
            {% if is_state(enabled, 'on') %}
              {% set d = e.state | int(999) %}
              {% if d < ns.days %}
                {% set ns.days = d %}
                {% set ns.name = state_attr(enabled, 'name') | default(base) %}
                {% set ns.time = '00:00:00' %}
                {% for suffix in ['start1_time', 'start2_time', 'start3_time', 'start_time'] %}
                  {% set candidate = states('time.' ~ base ~ '_' ~ suffix) %}
                  {% if candidate not in ['unknown', 'unavailable', 'none', '', '00:00:00'] %}
                    {% set ns.time = candidate %}
                  {% endif %}
                {% endfor %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% if ns.days == 999 %}
            No schedule enabled
          {% else %}
            {% set parts = ns.time.split(':') %}
            {% set run_at = (now() + timedelta(days=ns.days)).replace(
              hour=parts[0] | int(0),
              minute=parts[1] | int(0),
              second=0, microsecond=0) %}
            {% if (parts[0] | int(0)) == 0 and (parts[1] | int(0)) == 0 %}
              {{ run_at.strftime('%A, %b %d') }}
            {% else %}
              {{ run_at.strftime('%A, %b %d at %I:%M %p') }}
            {% endif %}
          {% endif %}
        {% endif %}
      attributes:
        program: >
          {% set ns = namespace(name='', days=999) %}
          {% for e in states.number if 'starting_in_days' in e.entity_id %}
            {% set base = e.entity_id | replace('number.', '') | replace('_starting_in_days', '') %}
            {% set enabled = 'switch.' ~ base ~ '_program_enabled' %}
            {% if is_state(enabled, 'on') %}
              {% set d = e.state | int(999) %}
              {% if d < ns.days %}
                {% set ns.days = d %}
                {% set ns.name = state_attr(enabled, 'name') | default(base) %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.name if ns.days != 999 else 'None' }}
        days_until: >
          {% set ns = namespace(days=999) %}
          {% for e in states.number if 'starting_in_days' in e.entity_id %}
            {% set base = e.entity_id | replace('number.', '') | replace('_starting_in_days', '') %}
            {% if is_state('switch.' ~ base ~ '_program_enabled', 'on') %}
              {% set d = e.state | int(999) %}
              {% if d < ns.days %}{% set ns.days = d %}{% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.days if ns.days != 999 else '' }}
