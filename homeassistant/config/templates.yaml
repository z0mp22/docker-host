- sensor:
    - name: Living Room Now Playing
      unique_id: living_room_now_playing
      icon: mdi:television
      state: >
        {% set roku = 'media_player.roku_4800x_a029' %}
        {% set preferred = ['media_player.plex_plex_for_roku_z_roku_ultra'] %}
        {% set ns = namespace(plex='') %}
        {% for entity_id in preferred %}
          {% if states(entity_id) not in ['unavailable', 'unknown', 'none']
             and (is_state(entity_id, 'playing') or is_state(entity_id, 'paused')) %}
            {% set ns.plex = entity_id %}
          {% endif %}
        {% endfor %}
        {% if not ns.plex %}
          {% for entity in states.media_player %}
            {% if entity.entity_id.startswith('media_player.plex_')
               and ('roku' in entity.entity_id or 'z_roku' in entity.entity_id or 'roku_ultra' in entity.entity_id)
               and (is_state(entity.entity_id, 'playing') or is_state(entity.entity_id, 'paused')) %}
              {% set ns.plex = entity.entity_id %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {% if not ns.plex and (is_state(roku, 'playing') or is_state(roku, 'paused')) %}
          {% if 'plex' in (state_attr(roku, 'app_name') | default('') | lower) %}
            {% for entity in states.media_player %}
              {% if entity.entity_id.startswith('media_player.plex_')
                 and (is_state(entity.entity_id, 'playing') or is_state(entity.entity_id, 'paused')) %}
                {% set ns.plex = entity.entity_id %}
              {% endif %}
            {% endfor %}
          {% endif %}
        {% endif %}
        {% if ns.plex %}
          {% if state_attr(ns.plex, 'media_content_type') == 'tvshow' %}
            {{ state_attr(ns.plex, 'media_series_title') }} S{{ state_attr(ns.plex, 'media_season') }}E{{ state_attr(ns.plex, 'media_episode') }} · {{ state_attr(ns.plex, 'media_title') }}
          {% else %}
            {{ state_attr(ns.plex, 'media_title') | default('Plex') }}
          {% endif %}
        {% elif is_state(roku, 'playing') or is_state(roku, 'paused') %}
          {{ state_attr(roku, 'app_name') | default(states(roku)) }}
        {% elif states(roku) not in ['unavailable', 'unknown'] %}
          Idle
        {% else %}
          Unavailable
        {% endif %}
      attributes:
        plex_entity: >
          {% set ns = namespace(id='') %}
          {% for entity in states.media_player %}
            {% if entity.entity_id.startswith('media_player.plex_')
               and ('roku' in entity.entity_id or 'z_roku' in entity.entity_id or 'roku_ultra' in entity.entity_id)
               and states(entity.entity_id) not in ['unavailable', 'unknown'] %}
              {% set ns.id = entity.entity_id %}
            {% endif %}
          {% endfor %}
          {{ ns.id }}

    - name: Basement Now Playing
      unique_id: basement_now_playing
      icon: mdi:television
      state: >
        {% set roku = 'media_player.basement_roku' %}
        {% set preferred = ['media_player.plex_plex_for_roku_basement_roku'] %}
        {% set ns = namespace(plex='') %}
        {% for entity_id in preferred %}
          {% if states(entity_id) not in ['unavailable', 'unknown', 'none']
             and (is_state(entity_id, 'playing') or is_state(entity_id, 'paused')) %}
            {% set ns.plex = entity_id %}
          {% endif %}
        {% endfor %}
        {% if not ns.plex %}
          {% for entity in states.media_player %}
            {% if entity.entity_id.startswith('media_player.plex_')
               and 'basement' in entity.entity_id
               and (is_state(entity.entity_id, 'playing') or is_state(entity.entity_id, 'paused')) %}
              {% set ns.plex = entity.entity_id %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {% if ns.plex %}
          {% if state_attr(ns.plex, 'media_content_type') == 'tvshow' %}
            {{ state_attr(ns.plex, 'media_series_title') }} S{{ state_attr(ns.plex, 'media_season') }}E{{ state_attr(ns.plex, 'media_episode') }} · {{ state_attr(ns.plex, 'media_title') }}
          {% else %}
            {{ state_attr(ns.plex, 'media_title') | default('Plex') }}
          {% endif %}
        {% elif is_state(roku, 'playing') or is_state(roku, 'paused') %}
          {{ state_attr(roku, 'app_name') | default(states(roku)) }}
        {% elif states(roku) not in ['unavailable', 'unknown'] %}
          Idle
        {% else %}
          Unavailable
        {% endif %}
      attributes:
        plex_entity: >
          {% set ns = namespace(id='') %}
          {% for entity in states.media_player %}
            {% if entity.entity_id.startswith('media_player.plex_')
               and 'basement' in entity.entity_id
               and states(entity.entity_id) not in ['unavailable', 'unknown'] %}
              {% set ns.id = entity.entity_id %}
            {% endif %}
          {% endfor %}
          {{ ns.id }}

    - name: Irrigation Next Run
      unique_id: irrigation_next_run
      icon: mdi:calendar-clock
      # The integration's next-run sensor expands weekly days, intervals and repeating start
      # times; it is found by attribute because its entity id carries a _2 suffix.
      state: >
        {% if is_state('binary_sensor.opensprinkler_rain_delay_active', 'on')
           and states('sensor.opensprinkler_rain_delay_stop_time') not in ['unknown', 'unavailable', 'none', ''] %}
          Rain delay until {{ as_timestamp(states('sensor.opensprinkler_rain_delay_stop_time')) | timestamp_custom('%b %d, %H:%M') }}
        {% else %}
          {% set s = states.sensor | selectattr('attributes.next_run_program_name', 'defined')
               | rejectattr('state', 'in', ['unknown', 'unavailable']) | list | first | default(none) %}
          {% set t = as_datetime(s.state) if s is not none else none %}
          {% if t is none %}
            No schedule enabled
          {% else %}
            {{ as_local(t).strftime('%A, %b %d') }} at {{ as_local(t).strftime('%I:%M %p') | regex_replace('^0', '') }}
          {% endif %}
        {% endif %}
      attributes:
        program: >
          {% set s = states.sensor | selectattr('attributes.next_run_program_name', 'defined')
               | rejectattr('state', 'in', ['unknown', 'unavailable']) | list | first | default(none) %}
          {{ (s.attributes.next_run_program_name | trim) if s is not none else 'None' }}
        days_until: >
          {% set s = states.sensor | selectattr('attributes.next_run_program_name', 'defined')
               | rejectattr('state', 'in', ['unknown', 'unavailable']) | list | first | default(none) %}
          {% set t = as_datetime(s.state) if s is not none else none %}
          {{ (as_local(t).date() - now().date()).days if t is not none else '' }}

- trigger:
    - platform: time_pattern
      hours: "/1"
      minutes: "10"
    - platform: homeassistant
      event: start
  action:
    - action: weather.get_forecasts
      target:
        entity_id: weather.home
      data:
        type: daily
      response_variable: daily
  sensor:
    - name: Home Weather Forecast
      unique_id: home_weather_forecast
      icon: mdi:weather-partly-cloudy
      state: >
        {% set fc = daily['weather.home'].forecast %}
        {% if fc and fc | length > 0 %}
          {{ fc[0].condition | replace('_', ' ') | title }}
        {% else %}
          {{ states('weather.home') | title }}
        {% endif %}
      attributes:
        forecast:
          value: "{{ daily['weather.home'].forecast | default([]) }}"
        temperature:
          value: "{{ state_attr('weather.home', 'temperature') }}"
        condition:
          value: "{{ states('weather.home') }}"
