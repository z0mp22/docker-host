notify_phones:
  alias: Push to every Companion app
  description: >-
    The one place that sends phone pushes. Companion app notify entities are named
    notify.<device> while the action is notify.mobile_app_<device>; matching notify entity ids
    on "mobile_app" finds nothing and silently drops every push. Each alert passes its own tag:
    Android replaces a notification that has the same tag, so a shared tag hides earlier alerts.
    scripts/lint-ha-notify.py enforces both.
  mode: parallel
  max: 20
  fields:
    title:
      description: Notification title
      example: Recording scheduled
      selector:
        text:
    message:
      description: Notification body ("clear_notification" removes the alert with this tag)
      example: USA · World Cup vs Bosnia
      required: true
      selector:
        text:
    tag:
      description: Unique per alert (per item when several can arrive together)
      example: plex-scheduled-usa_vs_bosnia
      required: true
      selector:
        text:
    channel:
      description: Android notification channel (settings are per channel on the phone)
      example: Recordings
      selector:
        text:
    data:
      description: Extra Companion app data (actions, image, url, ...); overrides the defaults
      example: "{'url': '/network'}"
      selector:
        object:
  sequence:
    - variables:
        mobile_notifiers: >-
          {{ integration_entities('mobile_app')
             | select('match', '^notify\\.')
             | map('replace', 'notify.', 'notify.mobile_app_', 1)
             | list }}
        # High priority + ttl 0 so Android doesn't hold the push while the phone dozes.
        push_data: >-
          {{ dict(dict({'channel': channel | default('General', true), 'importance': 'high',
                        'priority': 'high', 'ttl': 0,
                        'push': {'interruption-level': 'active'}}, **(data | default({}, true))),
                  tag=tag) }}
        clearing: "{{ message == 'clear_notification' }}"
    - if:
        - condition: template
          value_template: "{{ mobile_notifiers | count > 0 }}"
      then:
        - repeat:
            for_each: "{{ mobile_notifiers }}"
            sequence:
              - action: "{{ repeat.item }}"
                data:
                  title: "{{ title | default('', true) }}"
                  message: "{{ message }}"
                  data: "{{ {'tag': tag} if clearing else push_data }}"
      else:
        - if:
            - condition: template
              value_template: "{{ clearing }}"
          then:
            - action: persistent_notification.dismiss
              data:
                notification_id: "{{ tag }}"
          else:
            - action: persistent_notification.create
              data:
                notification_id: "{{ tag }}"
                title: "{{ title | default('', true) }}"
                message: "{{ message }} (no mobile app registered)"

coaching_report_run_since_last:
  alias: "Coaching report: run (since last report)"
  icon: mdi:chart-line
  mode: single
  sequence:
    - action: rest_command.coaching_report_dispatch_last
      response_variable: dispatch
      continue_on_error: true
    - action: persistent_notification.create
      data:
        notification_id: coaching_report_dispatch
        title: >-
          {{ 'Coaching report queued'
             if (dispatch is defined and dispatch.status == 204)
             else 'Coaching report dispatch FAILED' }}
        message: >-
          {% if dispatch is not defined %}
            Could not reach the GitHub API (network error). Nothing was dispatched.
          {% elif dispatch.status == 204 %}
            GitHub Actions accepted the run (since last report). The report email
            should arrive in a few minutes.
          {% else %}
            GitHub rejected the request — HTTP {{ dispatch.status }}.
            {{ dispatch.content if dispatch.content else 'No response body.' }}
          {% endif %}

