lift_feedback_submit:
  alias: "Lift: submit coach feedback"
  icon: mdi:comment-check-outline
  mode: single
  sequence:
    - variables:
        submitted_text: "{{ states('input_text.lift_feedback') | trim }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ submitted_text | length == 0 }}"
          sequence:
            - action: persistent_notification.create
              data:
                notification_id: lift_feedback_dispatch
                title: "Nothing to submit"
                message: "Type something in Coach Feedback first."
      default:
        - action: rest_command.lift_feedback_dispatch
          response_variable: dispatch
          continue_on_error: true
        # Clear the field immediately (the text is already captured in the
        # dispatch payload above) -- optimistic, doesn't wait on the remote
        # run, since workflow_dispatch has no way to call back into HA when
        # it's actually done.
        - action: input_text.set_value
          target:
            entity_id: input_text.lift_feedback
          data:
            value: ""
        - action: persistent_notification.create
          data:
            notification_id: lift_feedback_dispatch
            title: >-
              {{ 'Feedback logged'
                 if (dispatch is defined and dispatch.status == 204)
                 else 'Feedback submission FAILED' }}
            message: >-
              {% if dispatch is not defined %}
                Could not reach the GitHub API (network error). Nothing was logged.
              {% elif dispatch.status == 204 %}
                Logged: "{{ submitted_text }}" — the coach will factor this into
                future sessions.
              {% else %}
                GitHub rejected the request — HTTP {{ dispatch.status }}.
                {{ dispatch.content if dispatch.content else 'No response body.' }}
              {% endif %}

