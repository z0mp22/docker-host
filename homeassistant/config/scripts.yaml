notify_mobile_recording:
  alias: Notify all Companion mobile apps
  description: Sends a push notification to every registered Home Assistant mobile app.
  fields:
    title:
      description: Notification title
      example: Recording scheduled
      required: true
      selector:
        text:
    message:
      description: Notification body
      example: USA · World Cup vs Bosnia
      required: true
      selector:
        text:
  sequence:
    - variables:
        mobile_notifiers: >-
          {{ states.notify
             | selectattr('entity_id', 'search', 'mobile_app')
             | map(attribute='entity_id')
             | list }}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ mobile_notifiers | count > 0 }}"
          sequence:
            - repeat:
                for_each: "{{ mobile_notifiers }}"
                sequence:
                  - action: "{{ repeat.item }}"
                    data:
                      title: "{{ title }}"
                      message: "{{ message }}"
                      data:
                        tag: plex-recordings
                        channel: Recordings
                        importance: high
                        priority: high
                        ttl: 0
                        push:
                          sound:
                            name: default
                            critical: 0
                          interruption-level: active
        - conditions:
            - condition: template
              value_template: "{{ mobile_notifiers | count == 0 }}"
          sequence:
            - action: persistent_notification.create
              data:
                title: "{{ title }}"
                message: "{{ message }} (no mobile app registered)"

coaching_report_run_since_last:
  alias: "Coaching report: run (since last report)"
  icon: mdi:chart-line
  mode: single
  sequence:
    - action: rest_command.coaching_report_dispatch_last
      response_variable: dispatch
      continue_on_error: true
    - action: persistent_notification.create
      data:
        notification_id: coaching_report_dispatch
        title: >-
          {{ 'Coaching report queued'
             if (dispatch is defined and dispatch.status == 204)
             else 'Coaching report dispatch FAILED' }}
        message: >-
          {% if dispatch is not defined %}
            Could not reach the GitHub API (network error). Nothing was dispatched.
          {% elif dispatch.status == 204 %}
            GitHub Actions accepted the run (since last report). The report email
            should arrive in a few minutes.
          {% else %}
            GitHub rejected the request — HTTP {{ dispatch.status }}.
            {{ dispatch.content if dispatch.content else 'No response body.' }}
          {% endif %}

