title: Security
theme: RedditMushroom
views:
  - title: Cameras
    path: cameras
    icon: mdi:cctv
    theme: RedditMushroom
    cards:
      - type: custom:mushroom-template-card
        primary: >
          {% if is_state('binary_sensor.basement_all_occupancy', 'on') or is_state('binary_sensor.garage_all_occupancy', 'on')
             or is_state('binary_sensor.driveway_all_occupancy', 'on') or is_state('binary_sensor.bambu_motion', 'on') %}
          Activity detected
          {% else %}
          All clear
          {% endif %}
        secondary: Basement · Garage · Driveway · Bambu
        icon: >
          {% if is_state('binary_sensor.basement_all_occupancy', 'on') or is_state('binary_sensor.garage_all_occupancy', 'on')
             or is_state('binary_sensor.driveway_all_occupancy', 'on') or is_state('binary_sensor.bambu_motion', 'on') %}
          mdi:shield-alert
          {% else %}
          mdi:shield-check
          {% endif %}
        icon_color: >
          {% if is_state('binary_sensor.basement_all_occupancy', 'on') or is_state('binary_sensor.garage_all_occupancy', 'on')
             or is_state('binary_sensor.driveway_all_occupancy', 'on') or is_state('binary_sensor.bambu_motion', 'on') %}
          red
          {% else %}
          green
          {% endif %}
        fill_container: true

      # Only appears when a scream, yell, or fire alarm sound is actively detected —
      # quieter/more common sounds (bark, speech) are deliberately excluded here.
      - type: conditional
        conditions:
          - condition: or
            conditions:
              - condition: state
                entity: binary_sensor.basement_scream_sound
                state: "on"
              - condition: state
                entity: binary_sensor.basement_yell_sound
                state: "on"
              - condition: state
                entity: binary_sensor.basement_fire_alarm_sound
                state: "on"
              - condition: state
                entity: binary_sensor.garage_scream_sound
                state: "on"
              - condition: state
                entity: binary_sensor.garage_yell_sound
                state: "on"
              - condition: state
                entity: binary_sensor.garage_fire_alarm_sound
                state: "on"
              - condition: state
                entity: binary_sensor.driveway_scream_sound
                state: "on"
              - condition: state
                entity: binary_sensor.driveway_yell_sound
                state: "on"
              - condition: state
                entity: binary_sensor.driveway_fire_alarm_sound
                state: "on"
        card:
          type: custom:mushroom-template-card
          primary: Sound alert
          secondary: >
            {% set parts = [] %}
            {% for cam in ['basement', 'garage', 'driveway'] %}
              {% for kind in ['scream', 'yell', 'fire_alarm'] %}
                {% if is_state('binary_sensor.' ~ cam ~ '_' ~ kind ~ '_sound', 'on') %}
                  {% set parts = parts + [(kind | replace('_', ' ') | title) ~ ' @ ' ~ (cam | title)] %}
                {% endif %}
              {% endfor %}
            {% endfor %}
            {{ parts | join(' · ') }}
          icon: mdi:alarm-light
          icon_color: red
          fill_container: true

      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: entity
            entity: binary_sensor.basement_all_occupancy
            name: Basement
          - type: entity
            entity: binary_sensor.garage_all_occupancy
            name: Garage
          - type: entity
            entity: binary_sensor.driveway_all_occupancy
            name: Driveway
          - type: entity
            entity: binary_sensor.bambu_motion
            name: Bambu

      - type: custom:mushroom-title-card
        title: Live cameras

      - type: grid
        columns: 2
        square: false
        cards:
          - type: picture-entity
            entity: camera.driveway
            camera_view: live
            name: Driveway
            aspect_ratio: 16:9

          - type: picture-entity
            entity: camera.garage
            camera_view: live
            name: Garage
            aspect_ratio: 16:9

          - type: picture-entity
            entity: camera.bambu
            camera_view: live
            name: Bambu
            aspect_ratio: 16:9

          - type: picture-entity
            entity: camera.basement
            camera_view: live
            name: Basement
            aspect_ratio: 16:9

      - type: custom:mushroom-title-card
        title: Recent visitors
        subtitle: Person detections

      - type: grid
        columns: 3
        square: false
        cards:
          - type: picture-entity
            entity: image.driveway_person
            name: Driveway
            aspect_ratio: 16:9

          - type: picture-entity
            entity: image.basement_person
            name: Basement
            aspect_ratio: 16:9

          - type: picture-entity
            entity: image.garage_person
            name: Garage
            aspect_ratio: 16:9

      - type: custom:mushroom-title-card
        title: Sound monitoring
        subtitle: Live ambient sound level (dB)

      - type: entities
        entities:
          - entity: sensor.basement_sound_level
            name: Basement
          - entity: sensor.garage_sound_level
            name: Garage
          - entity: sensor.driveway_sound_level
            name: Driveway

      - type: custom:mushroom-title-card
        title: Needs review?
        subtitle: Unreviewed alerts/detections per camera

      - type: entities
        entities:
          - entity: sensor.basement_review_status
            name: Basement
          - entity: sensor.garage_review_status
            name: Garage
          - entity: sensor.driveway_review_status
            name: Driveway

      - type: custom:mushroom-title-card
        title: Recording
        subtitle: Toggle per-camera recording

      - type: grid
        columns: 4
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: switch.basement_recordings
            name: Basement
            icon: mdi:record-rec
            layout: vertical
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: switch.garage_recordings
            name: Garage
            icon: mdi:record-rec
            layout: vertical
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: switch.driveway_recordings
            name: Driveway
            icon: mdi:record-rec
            layout: vertical
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: switch.bambu_recordings
            name: Bambu
            icon: mdi:record-rec
            layout: vertical
            tap_action:
              action: toggle

      - type: custom:mushroom-title-card
        title: Detection
        subtitle: Toggle per-camera object detection

      - type: grid
        columns: 4
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: switch.basement_detect
            name: Basement
            icon: mdi:motion-sensor
            layout: vertical
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: switch.garage_detect
            name: Garage
            icon: mdi:motion-sensor
            layout: vertical
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: switch.driveway_detect
            name: Driveway
            icon: mdi:motion-sensor
            layout: vertical
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: switch.bambu_detect
            name: Bambu
            icon: mdi:motion-sensor
            layout: vertical
            tap_action:
              action: toggle

      - type: custom:mushroom-title-card
        title: Audio detection
        subtitle: Toggle per-camera sound classification (bark, scream, fire alarm, etc.)

      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: switch.basement_audio_detection
            name: Basement
            icon: mdi:microphone
            layout: vertical
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: switch.garage_audio_detection
            name: Garage
            icon: mdi:microphone
            layout: vertical
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: switch.driveway_audio_detection
            name: Driveway
            icon: mdi:microphone
            layout: vertical
            tap_action:
              action: toggle
