title: Security
theme: RedditMushroom
views:
  - title: Cameras
    path: cameras
    icon: mdi:cctv
    theme: RedditMushroom
    cards:
      - type: custom:mushroom-template-card
        primary: "{{ 'All clear' if is_state('binary_sensor.driveway_motion', 'off') and is_state('binary_sensor.garage_motion', 'off') and is_state('binary_sensor.bambu_motion', 'off') and is_state('binary_sensor.basement_motion', 'off') else 'Motion detected' }}"
        secondary: Driveway · Garage · Bambu · Basement
        icon: "{{ 'mdi:shield-check' if is_state('binary_sensor.driveway_motion', 'off') and is_state('binary_sensor.garage_motion', 'off') and is_state('binary_sensor.bambu_motion', 'off') and is_state('binary_sensor.basement_motion', 'off') else 'mdi:shield-alert' }}"
        fill_container: true

      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: entity
            entity: binary_sensor.driveway_motion
          - type: entity
            entity: binary_sensor.garage_motion
          - type: entity
            entity: binary_sensor.bambu_motion
          - type: entity
            entity: binary_sensor.basement_motion

      - type: custom:mushroom-title-card
        title: Live cameras

      - type: grid
        columns: 2
        square: false
        cards:
          - type: picture-entity
            entity: camera.driveway
            camera_view: live
            name: Driveway
            aspect_ratio: 16:9

          - type: picture-entity
            entity: camera.garage
            camera_view: live
            name: Garage
            aspect_ratio: 16:9

          - type: picture-entity
            entity: camera.bambu
            camera_view: live
            name: Bambu
            aspect_ratio: 16:9

          - type: picture-entity
            entity: camera.basement
            camera_view: live
            name: Basement
            aspect_ratio: 16:9

      - type: custom:mushroom-title-card
        title: Recent visitors
        subtitle: Person detections

      - type: grid
        columns: 3
        square: false
        cards:
          - type: picture-entity
            entity: image.driveway_person
            name: Driveway
            aspect_ratio: 16:9

          - type: picture-entity
            entity: image.basement_person
            name: Basement
            aspect_ratio: 16:9

          - type: picture-entity
            entity: image.garage_person
            name: Garage
            aspect_ratio: 16:9
