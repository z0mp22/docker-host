title: Recordings
theme: RedditMushroom
views:
  - title: Recordings
    path: recordings
    icon: mdi:television-classic
    theme: RedditMushroom
    cards:
      - type: custom:mushroom-title-card
        title: Plex DVR
        subtitle: media-laptop · OTA via HDHomeRun

      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: template
            icon: mdi:calendar-clock
            content: "{{ states('sensor.plex_recordings_status') | regex_replace('^[\\x00-\\x1f<>]+', '') | trim }}"
          - type: template
            icon: mdi:record-rec
            content: "{{ states('sensor.plex_recording_last_event') | regex_replace('^[\\x00-\\x1f<>]+', '') | trim | default('Nothing scheduled') }}"
          - type: template
            icon: mdi:check-circle
            content: "{{ states('sensor.plex_recording_last_completed') | regex_replace('^[\\x00-\\x1f<>]+', '') | trim | default('No recent recordings') }}"

      - type: custom:mushroom-template-card
        primary: Last scheduled
        secondary: "{{ states('sensor.plex_recording_last_event') | regex_replace('^[\\x00-\\x1f<>]+', '') | trim }}"
        icon: mdi:record-rec
        entity: sensor.plex_recording_last_event
        tap_action:
          action: more-info

      - type: custom:mushroom-template-card
        primary: Last completed
        secondary: "{{ states('sensor.plex_recording_last_completed') | regex_replace('^[\\x00-\\x1f<>]+', '') | trim }}"
        icon: mdi:check-circle
        entity: sensor.plex_recording_last_completed
        tap_action:
          action: more-info

      - type: custom:mushroom-title-card
        title: Upcoming
        subtitle: Scheduled and already queued in Plex

      - type: markdown
        content: >
          {% set upcoming = state_attr('sensor.plex_recordings_sync_meta', 'scheduled') | default([], true) %}
          {% set queued = state_attr('sensor.plex_recordings_sync_meta', 'skipped_existing') | default([], true) %}
          {% if upcoming is string or queued is string %}
          Sync metadata loading — check again after the next bridge run.
          {% elif upcoming | length == 0 and queued | length == 0 %}
          {% if states('sensor.plex_recording_last_event') not in ['unknown', 'unavailable', 'None queued', ''] %}
          **Queued in Plex**
          - {{ states('sensor.plex_recording_last_event') | regex_replace('^[\\x00-\\x1f<>]+', '') | trim }}
          {% else %}
          No upcoming team recordings in the next sync window.
          {% endif %}
          {% else %}
          {% for item in upcoming %}
          - **{{ item.team }}** — {{ item.title }}{% if item.show %} · {{ item.show }}{% endif %}  
            {{ item.air_time }}
          {% endfor %}
          {% for item in queued %}
          - **{{ item.team }}** — {{ item.title }} *(already in Plex)*  
            {{ item.air_time }}
          {% endfor %}
          {% endif %}

      - type: custom:mushroom-title-card
        title: Sync
        subtitle: "{{ state_attr('sensor.plex_recordings_sync_meta', 'ran_at') | default('Waiting for first sync') }}"
