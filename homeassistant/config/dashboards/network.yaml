title: Network
theme: RedditMushroom
views:
  - title: Network
    path: network
    icon: mdi:router-wireless
    theme: RedditMushroom
    cards:
      - type: custom:mushroom-template-card
        primary: >
          {% set ns = namespace(items=[]) %}
          {% if states('sensor.zsdm_cpu_utilization')|float(0) > 85 %}{% set ns.items = ns.items + ['ZsDM CPU high'] %}{% endif %}
          {% if states('sensor.upstairs_ap_cpu_utilization')|float(0) > 85 %}{% set ns.items = ns.items + ['Upstairs AP CPU high'] %}{% endif %}
          {% if states('sensor.garage_ap_cpu_utilization')|float(0) > 85 %}{% set ns.items = ns.items + ['Garage AP CPU high'] %}{% endif %}
          {% if states('sensor.middle_floor_cpu_utilization')|float(0) > 85 %}{% set ns.items = ns.items + ['Middle floor AP CPU high'] %}{% endif %}
          {% if states('sensor.zsdm_cloudflare_wan_latency')|float(0) > 100 %}{% set ns.items = ns.items + ['Cloudflare latency high'] %}{% endif %}
          {% if states('sensor.zsdm_google_wan_latency')|float(0) > 100 %}{% set ns.items = ns.items + ['Google latency high'] %}{% endif %}
          {% if states('sensor.zsdm_state') in ['unavailable','unknown'] %}{% set ns.items = ns.items + ['ZsDM unreachable'] %}{% endif %}
          {% if states('sensor.upstairs_ap_state') in ['unavailable','unknown'] %}{% set ns.items = ns.items + ['Upstairs AP unreachable'] %}{% endif %}
          {% if states('sensor.garage_ap_state') in ['unavailable','unknown'] %}{% set ns.items = ns.items + ['Garage AP unreachable'] %}{% endif %}
          {% if states('sensor.middle_floor_state') in ['unavailable','unknown'] %}{% set ns.items = ns.items + ['Middle floor AP unreachable'] %}{% endif %}
          {% if is_state('update.zsdm', 'on') %}{% set ns.items = ns.items + ['ZsDM firmware update available'] %}{% endif %}
          {% if is_state('update.upstairs_ap', 'on') %}{% set ns.items = ns.items + ['Upstairs AP firmware update available'] %}{% endif %}
          {% if is_state('update.garage_ap', 'on') %}{% set ns.items = ns.items + ['Garage AP firmware update available'] %}{% endif %}
          {% if is_state('update.middle_floor', 'on') %}{% set ns.items = ns.items + ['Middle floor AP firmware update available'] %}{% endif %}
          {% if ns.items | count > 0 %}{{ ns.items | count }} anomal{{ 'y' if ns.items | count == 1 else 'ies' }} detected{% else %}All systems normal{% endif %}
        secondary: >
          {% set ns = namespace(items=[]) %}
          {% if states('sensor.zsdm_cpu_utilization')|float(0) > 85 %}{% set ns.items = ns.items + ['ZsDM CPU high'] %}{% endif %}
          {% if states('sensor.upstairs_ap_cpu_utilization')|float(0) > 85 %}{% set ns.items = ns.items + ['Upstairs AP CPU high'] %}{% endif %}
          {% if states('sensor.garage_ap_cpu_utilization')|float(0) > 85 %}{% set ns.items = ns.items + ['Garage AP CPU high'] %}{% endif %}
          {% if states('sensor.middle_floor_cpu_utilization')|float(0) > 85 %}{% set ns.items = ns.items + ['Middle floor AP CPU high'] %}{% endif %}
          {% if states('sensor.zsdm_cloudflare_wan_latency')|float(0) > 100 %}{% set ns.items = ns.items + ['Cloudflare latency high'] %}{% endif %}
          {% if states('sensor.zsdm_google_wan_latency')|float(0) > 100 %}{% set ns.items = ns.items + ['Google latency high'] %}{% endif %}
          {% if states('sensor.zsdm_state') in ['unavailable','unknown'] %}{% set ns.items = ns.items + ['ZsDM unreachable'] %}{% endif %}
          {% if states('sensor.upstairs_ap_state') in ['unavailable','unknown'] %}{% set ns.items = ns.items + ['Upstairs AP unreachable'] %}{% endif %}
          {% if states('sensor.garage_ap_state') in ['unavailable','unknown'] %}{% set ns.items = ns.items + ['Garage AP unreachable'] %}{% endif %}
          {% if states('sensor.middle_floor_state') in ['unavailable','unknown'] %}{% set ns.items = ns.items + ['Middle floor AP unreachable'] %}{% endif %}
          {% if is_state('update.zsdm', 'on') %}{% set ns.items = ns.items + ['ZsDM firmware update available'] %}{% endif %}
          {% if is_state('update.upstairs_ap', 'on') %}{% set ns.items = ns.items + ['Upstairs AP firmware update available'] %}{% endif %}
          {% if is_state('update.garage_ap', 'on') %}{% set ns.items = ns.items + ['Garage AP firmware update available'] %}{% endif %}
          {% if is_state('update.middle_floor', 'on') %}{% set ns.items = ns.items + ['Middle floor AP firmware update available'] %}{% endif %}
          {% if ns.items | count > 0 %}{{ ns.items | join(' · ') }}{% else %}ZsDM gateway · Upstairs AP · Garage AP · Middle floor AP{% endif %}
        icon: >
          {% set bad = states('sensor.zsdm_cpu_utilization')|float(0) > 85
             or states('sensor.upstairs_ap_cpu_utilization')|float(0) > 85
             or states('sensor.garage_ap_cpu_utilization')|float(0) > 85
             or states('sensor.middle_floor_cpu_utilization')|float(0) > 85
             or states('sensor.zsdm_cloudflare_wan_latency')|float(0) > 100
             or states('sensor.zsdm_google_wan_latency')|float(0) > 100
             or states('sensor.zsdm_state') in ['unavailable','unknown']
             or states('sensor.upstairs_ap_state') in ['unavailable','unknown']
             or states('sensor.garage_ap_state') in ['unavailable','unknown']
             or states('sensor.middle_floor_state') in ['unavailable','unknown']
             or is_state('update.zsdm', 'on') or is_state('update.upstairs_ap', 'on')
             or is_state('update.garage_ap', 'on') or is_state('update.middle_floor', 'on') %}
          {{ 'mdi:alert-circle' if bad else 'mdi:check-circle' }}
        icon_color: >
          {% set bad = states('sensor.zsdm_cpu_utilization')|float(0) > 85
             or states('sensor.upstairs_ap_cpu_utilization')|float(0) > 85
             or states('sensor.garage_ap_cpu_utilization')|float(0) > 85
             or states('sensor.middle_floor_cpu_utilization')|float(0) > 85
             or states('sensor.zsdm_cloudflare_wan_latency')|float(0) > 100
             or states('sensor.zsdm_google_wan_latency')|float(0) > 100
             or states('sensor.zsdm_state') in ['unavailable','unknown']
             or states('sensor.upstairs_ap_state') in ['unavailable','unknown']
             or states('sensor.garage_ap_state') in ['unavailable','unknown']
             or states('sensor.middle_floor_state') in ['unavailable','unknown']
             or is_state('update.zsdm', 'on') or is_state('update.upstairs_ap', 'on')
             or is_state('update.garage_ap', 'on') or is_state('update.middle_floor', 'on') %}
          {{ 'red' if bad else 'green' }}
        fill_container: true

      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: template
            icon: mdi:account-group
            content: "{{ states('sensor.zsdm_clients') }} clients"
          - type: template
            icon: mdi:cloud-outline
            content: "Cloudflare {{ states('sensor.zsdm_cloudflare_wan_latency') }} ms"
          - type: template
            icon: mdi:google
            content: "Google {{ states('sensor.zsdm_google_wan_latency') }} ms"
          - type: template
            icon: mdi:clock-outline
            content: >
              {% set u = states('sensor.zsdm_uptime') %}
              {% if u not in ['unavailable','unknown'] %}
              Up since {{ as_timestamp(u) | timestamp_custom('%b %-d') }}
              {% else %}
              Uptime n/a
              {% endif %}

      - type: custom:mushroom-title-card
        title: WAN latency
        subtitle: Long-term statistics — line chart survives HA's short raw-history retention

      - type: statistics-graph
        chart_type: line
        entities:
          - sensor.zsdm_cloudflare_wan_latency
          - sensor.zsdm_google_wan_latency
        stat_types:
          - mean
          - max
        period: hour
        days_to_show: 7

      - type: custom:mushroom-title-card
        title: Connected clients
        subtitle: Total and per-SSID

      - type: statistics-graph
        chart_type: line
        entities:
          - sensor.zsdm_clients
          - sensor.starfleet_command
          - sensor.starfleet_command_guest
          - sensor.starfleet_command_kids
        stat_types:
          - mean
        period: hour
        days_to_show: 7

      - type: custom:mushroom-title-card
        title: CPU utilization

      - type: statistics-graph
        chart_type: line
        entities:
          - sensor.zsdm_cpu_utilization
          - sensor.upstairs_ap_cpu_utilization
          - sensor.garage_ap_cpu_utilization
          - sensor.middle_floor_cpu_utilization
        stat_types:
          - mean
          - max
        period: hour
        days_to_show: 7

      - type: custom:mushroom-title-card
        title: Memory utilization

      - type: statistics-graph
        chart_type: line
        entities:
          - sensor.zsdm_memory_utilization
          - sensor.upstairs_ap_memory_utilization
          - sensor.garage_ap_memory_utilization
          - sensor.middle_floor_memory_utilization
        stat_types:
          - mean
        period: hour
        days_to_show: 7

      - type: custom:mushroom-title-card
        title: Firmware
        subtitle: Green means current

      - type: entities
        entities:
          - entity: update.zsdm
            name: ZsDM
          - entity: update.upstairs_ap
            name: Upstairs AP
          - entity: update.garage_ap
            name: Garage AP
          - entity: update.middle_floor
            name: Middle floor AP
