title: Wildlife
theme: RedditMushroom
views:
  - title: Wildlife
    path: wildlife
    icon: mdi:bird
    theme: RedditMushroom
    cards:
      - type: custom:mushroom-template-card
        primary: >
          {% set animals = ['person', 'cat', 'dog', 'bear'] %}
          {% set ns = namespace(active=[]) %}
          {% for camera in ['basement', 'garage', 'driveway'] %}
            {% for animal in animals %}
              {% if is_state('binary_sensor.' ~ camera ~ '_' ~ animal ~ '_occupancy', 'on') %}
                {% set ns.active = ns.active + [animal | title ~ ' (' ~ camera | title ~ ')'] %}
              {% endif %}
            {% endfor %}
          {% endfor %}
          {% if ns.active | length > 0 %}Activity now{% else %}Yard is quiet{% endif %}
        secondary: >
          {% set animals = ['person', 'cat', 'dog', 'bear'] %}
          {% set ns = namespace(active=[]) %}
          {% for camera in ['basement', 'garage', 'driveway'] %}
            {% for animal in animals %}
              {% if is_state('binary_sensor.' ~ camera ~ '_' ~ animal ~ '_occupancy', 'on') %}
                {% set ns.active = ns.active + [animal | title ~ ' @ ' ~ camera] %}
              {% endif %}
            {% endfor %}
          {% endfor %}
          {{ ns.active | join(' · ') if ns.active | length > 0 else 'Person, cat, dog, and bear only (Frigate history)' }}
        icon: mdi:paw
        fill_container: true

      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: template
            icon: mdi:account
            content: Person
          - type: template
            icon: mdi:cat
            content: Cat
          - type: template
            icon: mdi:dog
            content: Dog
          - type: template
            icon: mdi:paw
            content: Bear
          - type: template
            icon: mdi:cctv
            content: Basement · Garage · Driveway

      - type: custom:mushroom-title-card
        title: People
        subtitle: Recent person detections

      - type: grid
        columns: 3
        square: false
        cards:
          - type: picture-entity
            entity: image.basement_person
            name: Basement
            aspect_ratio: 16:9
          - type: picture-entity
            entity: image.garage_person
            name: Garage
            aspect_ratio: 16:9
          - type: picture-entity
            entity: image.driveway_person
            name: Driveway
            aspect_ratio: 16:9

      - type: custom:mushroom-title-card
        title: Pets
        subtitle: Cats and dogs when seen on camera

      - type: grid
        columns: 3
        square: false
        cards:
          - type: picture-entity
            entity: image.basement_cat
            name: Basement · Cat
            aspect_ratio: 16:9
          - type: picture-entity
            entity: image.garage_cat
            name: Garage · Cat
            aspect_ratio: 16:9
          - type: picture-entity
            entity: image.driveway_cat
            name: Driveway · Cat
            aspect_ratio: 16:9
          - type: picture-entity
            entity: image.basement_dog
            name: Basement · Dog
            aspect_ratio: 16:9
          - type: picture-entity
            entity: image.garage_dog
            name: Garage · Dog
            aspect_ratio: 16:9
          - type: picture-entity
            entity: image.driveway_dog
            name: Driveway · Dog
            aspect_ratio: 16:9

      - type: custom:mushroom-title-card
        title: Bear
        subtitle: Rare large wildlife detections

      - type: grid
        columns: 3
        square: false
        cards:
          - type: picture-entity
            entity: image.basement_bear
            name: Basement
            aspect_ratio: 16:9
          - type: picture-entity
            entity: image.garage_bear
            name: Garage
            aspect_ratio: 16:9
          - type: picture-entity
            entity: image.driveway_bear
            name: Driveway
            aspect_ratio: 16:9
