title: Wildlife
theme: RedditMushroom
views:
  - title: Wildlife
    path: wildlife
    icon: mdi:bird
    theme: RedditMushroom
    cards:
      - type: custom:mushroom-template-card
        primary: >
          {% set cameras = ['basement', 'garage', 'driveway'] %}
          {% set animals = ['bird', 'deer', 'raccoon', 'fox', 'squirrel', 'rabbit', 'skunk', 'bear', 'cat', 'dog', 'horse', 'cow', 'goat', 'sheep'] %}
          {% set ns = namespace(active=[]) %}
          {% for camera in cameras %}
            {% for animal in animals %}
              {% set entity = 'binary_sensor.' ~ camera ~ '_' ~ animal ~ '_occupancy' %}
              {% if states(entity) == 'on' %}
                {% set ns.active = ns.active + [animal ~ ' @ ' ~ camera] %}
              {% endif %}
            {% endfor %}
          {% endfor %}
          {% if ns.active | length > 0 %}
            Wildlife active now
          {% else %}
            Yard is peaceful
          {% endif %}
        secondary: >
          {% set cameras = ['basement', 'garage', 'driveway'] %}
          {% set animals = ['bird', 'deer', 'raccoon', 'fox', 'squirrel', 'rabbit', 'skunk', 'bear', 'cat', 'dog', 'horse', 'cow', 'goat', 'sheep'] %}
          {% set ns = namespace(active=[]) %}
          {% for camera in cameras %}
            {% for animal in animals %}
              {% set entity = 'binary_sensor.' ~ camera ~ '_' ~ animal ~ '_occupancy' %}
              {% if states(entity) == 'on' %}
                {% set ns.active = ns.active + [animal | title ~ ' (' ~ camera | title ~ ')'] %}
              {% endif %}
            {% endfor %}
          {% endfor %}
          {% if ns.active | length > 0 %}
            {{ ns.active | join(' · ') }}
          {% else %}
            No wildlife detected right now
          {% endif %}
        icon: >
          {% set cameras = ['basement', 'garage', 'driveway'] %}
          {% set animals = ['bird', 'deer', 'raccoon', 'fox', 'squirrel', 'rabbit', 'skunk', 'bear', 'cat', 'dog', 'horse', 'cow', 'goat', 'sheep'] %}
          {% set ns = namespace(active=false) %}
          {% for camera in cameras %}
            {% for animal in animals %}
              {% if is_state('binary_sensor.' ~ camera ~ '_' ~ animal ~ '_occupancy', 'on') %}
                {% set ns.active = true %}
              {% endif %}
            {% endfor %}
          {% endfor %}
          {{ 'mdi:bird' if ns.active else 'mdi:tree' }}
        fill_container: true

      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: template
            icon: mdi:bird
            content: >
              {% set ns = namespace(count=0) %}
              {% for camera in ['basement', 'garage', 'driveway'] %}
                {% if is_state('binary_sensor.' ~ camera ~ '_bird_occupancy', 'on') %}
                  {% set ns.count = ns.count + 1 %}
                {% endif %}
              {% endfor %}
              {{ ns.count }} bird{{ 's' if ns.count != 1 else '' }} now
          - type: template
            icon: mdi:deer
            content: >
              {% set ns = namespace(count=0) %}
              {% for camera in ['basement', 'garage', 'driveway'] %}
                {% if is_state('binary_sensor.' ~ camera ~ '_deer_occupancy', 'on') %}
                  {% set ns.count = ns.count + 1 %}
                {% endif %}
              {% endfor %}
              {{ ns.count }} deer now
          - type: template
            icon: mdi:paw
            content: 14 species tracked
          - type: template
            icon: mdi:cctv
            content: Basement · Garage · Driveway

      - type: custom:mushroom-title-card
        title: Birds
        subtitle: Latest detections · species labels appear in Frigate when confident

      - type: grid
        columns: 3
        square: false
        cards:
          - type: picture-entity
            entity: image.basement_bird
            name: Basement
            aspect_ratio: 16:9

          - type: picture-entity
