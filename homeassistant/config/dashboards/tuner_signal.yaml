title: Tuner Signal
theme: RedditMushroom
views:
  - title: Tuner Signal
    path: tuner-signal
    icon: mdi:antenna
    theme: RedditMushroom
    cards:
      # Job: "Can the antenna record cleanly right now, and which channel can't?"
      # Readings only exist while a tuner is in use (recording or live TV).
      - type: custom:mushroom-title-card
        title: HDHomeRun
        subtitle: >
          {% set s = states('sensor.hdhomerun_tuners') %}
          {% set u = state_attr('sensor.hdhomerun_tuners', 'updated_at') %}
          {% if s in ['No data', 'unavailable', 'unknown'] %}No data from the signal poller{% if u %} since {{ as_timestamp(u) | timestamp_custom('%a %-I:%M %p') }}{% endif %}
          {% elif s == 'Idle' %}Both tuners idle · readings appear while something records
          {% else %}{{ s }}{% endif %}

      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: template
            icon: mdi:weather-partly-cloudy
            content: >
              {% set cond = state_attr('sensor.hdhomerun_tuners', 'weather_condition') %}
              {% set temp = state_attr('sensor.hdhomerun_tuners', 'weather_temperature') %}
              {% if cond %}{{ temp }}° {{ cond | replace('partlycloudy', 'partly cloudy') | replace('_', ' ') | replace('-', ' ') | capitalize }}{% else %}Weather n/a{% endif %}

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.hdhomerun_tuners
            primary: >
              {% set id = 'tuner0' %}
              {% set m = (state_attr('sensor.hdhomerun_tuners', 'tuners') or []) | selectattr('tuner', 'eq', id) | list %}
              {% set t = m[0] if m else none %}
              {% if states('sensor.hdhomerun_tuners') in ['No data', 'unavailable', 'unknown'] %}No data
              {% elif not t %}Idle
              {% else %}{{ t.channel }} {{ t.channel_name or '' }}{% endif %}
            secondary: >
              {% set id = 'tuner0' %}
              {% set m = (state_attr('sensor.hdhomerun_tuners', 'tuners') or []) | selectattr('tuner', 'eq', id) | list %}
              {% set t = m[0] if m else none %}
              {% if states('sensor.hdhomerun_tuners') in ['No data', 'unavailable', 'unknown'] or not t %}Tuner {{ id[-1] | int + 1 }}
              {% elif t.settling %}Tuner {{ id[-1] | int + 1 }} · locking on
              {% else %}Quality {{ t.quality }}% · signal {{ t.strength }}% · {{ 'no errors' if (t.symbol or 0) >= 100 else 'picture errors' }}{% endif %}
            icon: mdi:television-classic
            icon_color: >
              {% set id = 'tuner0' %}
              {% set m = (state_attr('sensor.hdhomerun_tuners', 'tuners') or []) | selectattr('tuner', 'eq', id) | list %}
              {% set t = m[0] if m else none %}
              {% if states('sensor.hdhomerun_tuners') in ['No data', 'unavailable', 'unknown'] or not t or t.settling %}grey
              {% elif (t.symbol or 0) < 100 %}red
              {% elif (t.quality or 0) < 70 %}amber
              {% else %}green{% endif %}
          - type: custom:mushroom-template-card
            entity: sensor.hdhomerun_tuners
            primary: >
              {% set id = 'tuner1' %}
              {% set m = (state_attr('sensor.hdhomerun_tuners', 'tuners') or []) | selectattr('tuner', 'eq', id) | list %}
              {% set t = m[0] if m else none %}
              {% if states('sensor.hdhomerun_tuners') in ['No data', 'unavailable', 'unknown'] %}No data
              {% elif not t %}Idle
              {% else %}{{ t.channel }} {{ t.channel_name or '' }}{% endif %}
            secondary: >
              {% set id = 'tuner1' %}
              {% set m = (state_attr('sensor.hdhomerun_tuners', 'tuners') or []) | selectattr('tuner', 'eq', id) | list %}
              {% set t = m[0] if m else none %}
              {% if states('sensor.hdhomerun_tuners') in ['No data', 'unavailable', 'unknown'] or not t %}Tuner {{ id[-1] | int + 1 }}
              {% elif t.settling %}Tuner {{ id[-1] | int + 1 }} · locking on
              {% else %}Quality {{ t.quality }}% · signal {{ t.strength }}% · {{ 'no errors' if (t.symbol or 0) >= 100 else 'picture errors' }}{% endif %}
            icon: mdi:television-classic
            icon_color: >
              {% set id = 'tuner1' %}
              {% set m = (state_attr('sensor.hdhomerun_tuners', 'tuners') or []) | selectattr('tuner', 'eq', id) | list %}
              {% set t = m[0] if m else none %}
              {% if states('sensor.hdhomerun_tuners') in ['No data', 'unavailable', 'unknown'] or not t or t.settling %}grey
              {% elif (t.symbol or 0) < 100 %}red
              {% elif (t.quality or 0) < 70 %}amber
              {% else %}green{% endif %}

      # Live readings go empty when both tuners are idle (most of the time), so this is
      # what answers "how did the last recording look?" (plex_recordings ADR 0014).
      - type: markdown
        title: Last 7 days by channel
        content: |
          {% set r = state_attr('sensor.hdhomerun_tuners', 'recent') %}
          {% set ch = (r or {}).get('channels') or {} %}
          {% if r is none %}No summary from the signal poller yet.
          {% elif not ch %}Nothing recorded in the last 7 days.
          {% else %}
          | Channel | Last tuned | Avg quality | Worst minute | Picture errors |
          |:--|:--|--:|--:|--:|
          {% for k, v in ch.items() | sort(attribute='1.last_seen', reverse=true) -%}
          {%- set s = v.last_session -%}
          {%- set m = s.minutes | int(0) -%}
          | **{{ k }}** {{ v.channel_name or '' }} | {{ as_timestamp(v.last_seen) | timestamp_custom('%a %b %-d, %-I:%M %p') }} · {{ ([(m // 60) ~ ' h'] if m >= 60 else []) | join }}{{ ' ' if m >= 60 and m % 60 else '' }}{{ ((m % 60) ~ ' min') if m % 60 or m < 60 else '' }} | {{ s.avg_quality | round(0) | int }}% | {{ s.worst_quality }}% | {{ s.error_minutes ~ ' min' if s.error_minutes else 'none' }} |
          {% endfor %}

          Figures are for the last recording on each channel. Below 70% is weak but can still record cleanly; picture errors are minutes the stream broke up.
          {% endif %}

      - type: custom:mushroom-title-card
        title: By channel
        subtitle: Signal quality, one bar per channel · only days a channel was tuned

      - type: statistics-graph
        title: Worst minute each day
        # Bars, not lines: HA draws line series without point markers, so a channel
        # tuned on a single day (one point) would be invisible.
        chart_type: bar
        period: day
        days_to_show: 60
        stat_types:
          - min
        entities: &channel_entities
          - entity: sensor.tuner_quality_22_1_kfct_fox
            name: 22.1 FOX
          - entity: sensor.tuner_quality_31_1_kdvr_fox
            name: 31.1 FOX
          - entity: sensor.tuner_quality_27_1_klwy_fox
            name: 27.1 FOX
          - entity: sensor.tuner_quality_5_1_kgwn_cbs
            name: 5.1 CBS
          - entity: sensor.tuner_quality_4_1_kcnc_cbs
            name: 4.1 CBS
          - entity: sensor.tuner_quality_5_2_kgwn_nbc
            name: 5.2 NBC
          - entity: sensor.tuner_quality_9_1_kusa_nbc
            name: 9.1 NBC
          - entity: sensor.tuner_quality_7_1_kmgh_abc
            name: 7.1 ABC

      - type: statistics-graph
        title: Daily average
        # Bars, not lines: HA draws line series without point markers, so a channel
        # tuned on a single day (one point) would be invisible.
        chart_type: bar
        period: day
        days_to_show: 60
        stat_types:
          - mean
        entities: *channel_entities

      - type: markdown
        content: >
          **Reading this:** a channel that sits low but steady (4.1 runs about
          55%) still records cleanly. A worst minute near 0 is a dropout: the
          picture broke up for that minute. NBC records from 5.2; 9.1 is a
          fallback for KUSA-only airings because it drops out (ADR 0012 in
          `plex_recordings`).


          Weather correlation per channel: `./scripts/analyze_signal_weather.py`
          on media-laptop, which reads the full sample log
          (`logs/hdhomerun_signal.jsonl` in `plex_recordings`).
