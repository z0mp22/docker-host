title: Roku
theme: RedditMushroom
views:
  - title: Roku
    path: roku
    icon: mdi:television-play
    theme: RedditMushroom
    cards:
      - type: custom:mushroom-template-card
        primary: Now Playing
        secondary: >
          {% if states('sensor.living_room_now_playing') not in ['Idle', 'Unavailable', 'unknown', 'unavailable']
             or states('sensor.basement_now_playing') not in ['Idle', 'Unavailable', 'unknown', 'unavailable'] %}
            Living room · {{ states('sensor.living_room_now_playing') }}
            Basement · {{ states('sensor.basement_now_playing') }}
          {% elif states('sensor.living_room_now_playing') not in ['Idle', 'Unavailable', 'unknown', 'unavailable'] %}
            Living room · {{ states('sensor.living_room_now_playing') }}
          {% elif states('sensor.basement_now_playing') not in ['Idle', 'Unavailable', 'unknown', 'unavailable'] %}
            Basement · {{ states('sensor.basement_now_playing') }}
          {% else %}
            Nothing playing
          {% endif %}
        icon: mdi:play-circle
        tap_action:
          action: none

      - type: custom:mushroom-title-card
        title: Living Room
        subtitle: Z Roku Ultra · 10.0.0.208

      - type: custom:mushroom-template-card
        primary: "{{ states('sensor.living_room_now_playing') }}"
        secondary: "{{ state_attr('media_player.z_roku_ultra', 'app_name') | default('Roku') }}"
        icon: mdi:sofa
        entity: sensor.living_room_now_playing
        tap_action:
          action: more-info

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-media-player-card
            entity: media_player.z_roku_ultra
            name: Roku
            use_media_info: true

          - type: custom:mushroom-media-player-card
            entity: media_player.plex_plex_for_roku_z_roku_ultra
            name: Plex
            use_media_info: true

      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: entity
            entity: media_player.z_roku_ultra
          - type: entity
            entity: sensor.z_roku_ultra_active_app

      - type: custom:mushroom-title-card
        title: Basement
        subtitle: Basement Roku · 10.0.0.188

      - type: custom:mushroom-template-card
        primary: "{{ states('sensor.basement_now_playing') }}"
        secondary: "{{ state_attr('media_player.basement_roku', 'app_name') | default('Roku') }}"
        icon: mdi:home-floor-b
        entity: sensor.basement_now_playing
        tap_action:
          action: more-info

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-media-player-card
            entity: media_player.basement_roku
            name: Roku
            use_media_info: true

          - type: custom:mushroom-media-player-card
            entity: media_player.plex_plex_for_roku_basement_roku
            name: Plex
            use_media_info: true

      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: entity
            entity: media_player.basement_roku
          - type: entity
            entity: sensor.basement_roku_active_app
