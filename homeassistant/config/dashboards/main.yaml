title: Home
theme: RedditMushroom
views:
  - title: Home
    path: home
    icon: mdi:home
    theme: RedditMushroom
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: At a glance
            subtitle: "{{ states('weather.home') | title }} · {{ state_attr('weather.home', 'temperature') | default('—') }}°F"

          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:weather-partly-cloudy
                content: "{{ state_attr('weather.home', 'temperature') | default('—') }}° {{ states('weather.home') }}"
              - type: template
                icon: mdi:shield-home
                content: >
                  {% if is_state('binary_sensor.driveway_motion', 'on') or is_state('binary_sensor.garage_motion', 'on')
                     or is_state('binary_sensor.basement_motion', 'on') or is_state('binary_sensor.bambu_motion', 'on') %}
                  Motion detected
                  {% else %}
                  All clear
                  {% endif %}
              - type: template
                icon: mdi:sprinkler
                content: "Water {{ states('sensor.irrigation_next_run') | default('No schedule') }}"
              - type: template
                icon: mdi:paw
                content: >
                  {% set animals = ['person', 'cat', 'dog', 'bear', 'raccoon'] %}
                  {% set ns = namespace(count=0) %}
                  {% for camera in ['basement', 'garage', 'driveway'] %}
                    {% for animal in animals %}
                      {% if is_state('binary_sensor.' ~ camera ~ '_' ~ animal ~ '_occupancy', 'on') %}
                        {% set ns.count = ns.count + 1 %}
                      {% endif %}
                    {% endfor %}
                  {% endfor %}
                  {% if ns.count > 0 %}Wildlife active{% else %}Wildlife quiet{% endif %}
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-wildlife/wildlife

      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Media & recordings

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Now Playing
                secondary: "{{ states('sensor.living_room_now_playing') }}"
                icon: mdi:play-circle
                entity: sensor.living_room_now_playing
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-roku/roku

              - type: custom:mushroom-template-card
                primary: Plex Recordings
                secondary: "{{ states('sensor.plex_recordings_status') | regex_replace('^[\\x00-\\x1f<>]+', '') | trim | default('No sync yet') }}"
                icon: mdi:television-classic
                entity: sensor.plex_recordings_status
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-recordings/recordings

      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Weather
            subtitle: "{{ state_attr('sensor.home_weather_forecast', 'temperature') | default('—') }}°F · {{ state_attr('sensor.home_weather_forecast', 'condition') | default(states('weather.home')) | title }}"

          - type: vertical-stack
            cards:
              - type: custom:mushroom-template-card
                layout: horizontal
                primary: >-
                  {% set fc = state_attr('sensor.home_weather_forecast', 'forecast') | default([], true) %}
                  {% set day = fc[0] if fc is not string and fc | length > 0 else none %}
                  {{ as_timestamp(day.datetime) | timestamp_custom('%a %b %d') if day else '—' }}
                secondary: >-
                  {% set fc = state_attr('sensor.home_weather_forecast', 'forecast') | default([], true) %}
                  {% set day = fc[0] if fc is not string and fc | length > 0 else none %}
                  {% if day %}{{ day.temperature }}° / {{ day.templow }}° · {{ day.condition | replace('_', ' ') | title }}{% else %}Loading…{% endif %}
                icon: >-
                  {% set fc = state_attr('sensor.home_weather_forecast', 'forecast') | default([], true) %}
                  {% set day = fc[0] if fc is not string and fc | length > 0 else none %}
                  {% set c = (day.condition if day else 'cloudy') | lower %}
                  {% if c in ['sunny', 'clear'] %}mdi:weather-sunny{% elif c == 'partlycloudy' %}mdi:weather-partly-cloudy{% elif c == 'cloudy' %}mdi:weather-cloudy{% elif c == 'pouring' %}mdi:weather-pouring{% elif c == 'rainy' %}mdi:weather-rainy{% elif c == 'lightning' %}mdi:weather-lightning{% elif c == 'snowy' %}mdi:weather-snowy{% elif c == 'fog' %}mdi:weather-fog{% elif c == 'windy' %}mdi:weather-windy{% elif c == 'hail' %}mdi:weather-hail{% else %}mdi:weather-partly-cloudy{% endif %}
                icon_color: >-
                  {% set fc = state_attr('sensor.home_weather_forecast', 'forecast') | default([], true) %}
                  {% set day = fc[0] if fc is not string and fc | length > 0 else none %}
                  {% set c = (day.condition if day else 'cloudy') | lower %}
                  {% if c in ['sunny', 'clear'] %}orange{% elif c in ['rainy', 'pouring', 'lightning'] %}blue{% elif c == 'snowy' %}light-blue{% else %}disabled{% endif %}
                visibility:
                  - condition: template
                    value_template: "{{ state_attr('sensor.home_weather_forecast', 'forecast') is not none and (state_attr('sensor.home_weather_forecast', 'forecast') | length) > 0 }}"
              - type: custom:mushroom-template-card
