title: Home
theme: RedditMushroom
views:
  - title: Home
    path: home
    icon: mdi:home
    theme: RedditMushroom
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: At a glance
            subtitle: "{{ states('weather.home') | title }} · {{ state_attr('weather.home', 'temperature') | default('—') }}°F"

          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:weather-partly-cloudy
                content: "{{ state_attr('weather.home', 'temperature') | default('—') }}° {{ states('weather.home') }}"
              - type: template
                icon: mdi:shield-home
                content: >
                  {% if is_state('binary_sensor.driveway_motion', 'on') or is_state('binary_sensor.garage_motion', 'on')
                     or is_state('binary_sensor.basement_motion', 'on') or is_state('binary_sensor.bambu_motion', 'on') %}
                  Motion detected
                  {% else %}
                  All clear
                  {% endif %}
              - type: template
                icon: mdi:sprinkler
                content: "Water {{ states('sensor.irrigation_next_run') | default('No schedule') }}"
              - type: template
                icon: mdi:paw
                content: >
                  {% set animals = ['person', 'cat', 'dog', 'bear'] %}
                  {% set ns = namespace(count=0) %}
                  {% for camera in ['basement', 'garage', 'driveway'] %}
                    {% for animal in animals %}
                      {% if is_state('binary_sensor.' ~ camera ~ '_' ~ animal ~ '_occupancy', 'on') %}
                        {% set ns.count = ns.count + 1 %}
                      {% endif %}
                    {% endfor %}
                  {% endfor %}
                  {% if ns.count > 0 %}Wildlife active{% else %}Wildlife quiet{% endif %}
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-wildlife/wildlife

      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Media & recordings

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Now Playing
                secondary: "{{ states('sensor.living_room_now_playing') }}"
                icon: mdi:play-circle
                entity: sensor.living_room_now_playing
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-roku/roku

              - type: custom:mushroom-template-card
                primary: Plex Recordings
                secondary: "{{ states('sensor.plex_recordings_status') | regex_replace('^[\\x00-\\x1f<>]+', '') | trim | default('No sync yet') }}"
                icon: mdi:television-classic
                entity: sensor.plex_recordings_status
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-recordings/recordings

      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Weather
            subtitle: "{{ state_attr('sensor.home_weather_forecast', 'temperature') | default('—') }}°F · {{ state_attr('sensor.home_weather_forecast', 'condition') | default(states('weather.home')) | title }}"

          - type: markdown
            content: >
              {% set fc = state_attr('sensor.home_weather_forecast', 'forecast') | default([], true) %}
              {% if fc is string or fc | length == 0 %}
              Forecast loading…
              {% else %}
              {% for day in fc[:7] %}
              - **{{ as_timestamp(day.datetime) | timestamp_custom('%a %b %d') }}** — {{ day.condition | replace('_', ' ') | title }} · {{ day.temperature }}° / {{ day.templow }}°
              {% endfor %}
              {% endif %}

      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Outdoor
            subtitle: Front yard lights and fan

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: switch.front_lights_shelly_1_plus
                name: Outdoor Garage Lights
                icon: mdi:garage
                layout: vertical
                tap_action:
                  action: toggle

              - type: custom:mushroom-entity-card
                entity: switch.front_door_light_shelly_1
                name: Front Door Light
                icon: mdi:door-sliding
                layout: vertical
                tap_action:
                  action: toggle

              - type: custom:mushroom-entity-card
                entity: switch.whole_house_fan_switch_1
                name: Whole House Fan
                icon: mdi:fan
                layout: vertical
                tap_action:
                  action: toggle

              - type: custom:mushroom-light-card
                entity: light.basement
                name: Basement Light
                icon: mdi:lightbulb
                layout: vertical

      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Yard lighting
            subtitle: Sunset and sunrise automations

          - type: entities
            entities:
              - automation.front_yard_lights_on_at_sunset
              - automation.front_yard_lights_off_at_23_00
              - automation.front_yard_lights_on_at_04_45_if_dark
              - automation.front_yard_lights_off_at_sunrise
