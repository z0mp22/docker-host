# Main stack for Raspberry Pi docker host (10.0.0.4).
# Runtime path: /docker/docker-compose.yml (synced by scripts/deploy.sh)

services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: America/Denver
    volumes:
      - /docker/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2.0.15
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - /docker/mosquitto/config:/mosquitto/config
      - /docker/mosquitto/data:/mosquitto/data
      - /docker/mosquitto/log:/mosquitto/log
    networks:
      - mqtt_network

  npm:
    container_name: npm
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - /docker/npm/data:/data
      - /docker/npm/letsencrypt:/etc/letsencrypt
    networks:
      - docker_default

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8053:8053"
    environment:
      TZ: America/Denver
      WEB_PORT: 8053
      WEBPASSWORD: ${PIHOLE_WEBPASSWORD:-}
    volumes:
      - /docker/pihole/etc-pihole:/etc/pihole
      - /docker/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    networks:
      - docker_default

  # Eufy HomeBase 2 + doorbell for the ha-eufy-sdk integration (HA connects to 127.0.0.1:3000).
  # Ports are published on loopback only: the bundled go2rtc always listens on all interfaces, and its
  # unauthenticated API can add exec: stream sources, so it must not be reachable from the LAN.
  # Eufy allows one session per account: opening the Eufy phone app can bump this bridge's login.
  eufy-bridge:
    container_name: eufy-bridge
    image: ghcr.io/mega-yfue/ha-eufy-sdk-bridge:0.3.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:1984:1984"
      - "127.0.0.1:8554:8554"
    environment:
      TZ: America/Denver
      EUFY_EMAIL: ${EUFY_EMAIL:-}
      EUFY_PASSWORD: ${EUFY_PASSWORD:-}
      EUFY_COUNTRY: ${EUFY_COUNTRY:-US}
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: 3000
      BRIDGE_SELF_HOST: 127.0.0.1
    volumes:
      - /docker/eufy-bridge:/app/data
    networks:
      - docker_default

networks:
  mqtt_network:
    external: true
    name: mqtt_network
  docker_default:
    external: true
    name: docker_default
