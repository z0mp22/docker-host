# Included at server scope by every NPM proxy host (/data/nginx/custom/server_proxy[.]conf).
# Public hosts sit behind Cloudflare, which sends the visitor's address in CF-Connecting-IP,
# not X-Real-IP (NPM's default). NPM already trusts Cloudflare's ranges via
# conf.d/include/ip_ranges.conf, so this makes $remote_addr (and the access logs) show the
# real client instead of a Cloudflare edge. Requests without the header (LAN-only hosts) keep
# their socket address. Caveat: ip_ranges.conf also trusts CloudFront, so a client coming
# through CloudFront could set this header itself.
real_ip_header CF-Connecting-IP;
