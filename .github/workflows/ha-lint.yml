name: HA config lint

# Static gate for Home Assistant config; runs on every PR and push. GitHub-hosted on purpose:
# this repo is public, so PR code must never run on the self-hosted docker-host runner.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    name: Phone pushes go through script.notify_phones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/lint-ha-notify.py
