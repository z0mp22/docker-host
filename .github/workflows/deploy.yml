name: Docker Host Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, docker-host]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to /docker
        env:
          PULL_IMAGES: "0"
          HA_TOKEN: ${{ secrets.HA_LONG_LIVED_ACCESS_TOKEN }}
        run: bash scripts/deploy.sh

      - name: Validate services
        env:
          HA_TOKEN: ${{ secrets.HA_LONG_LIVED_ACCESS_TOKEN }}
          HA_USERNAME: ${{ secrets.HA_USERNAME }}
          HA_PASSWORD: ${{ secrets.HA_PASSWORD }}
        run: bash scripts/validate.sh

      - name: Dump Home Assistant logs on failure
        if: failure()
        run: docker logs homeassistant 2>&1 | tail -80

      - name: Validate MQTT topics for Plex recordings
        run: bash scripts/validate-mqtt-ha.sh

      - name: Show stack status
        run: |
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
