name: Backfill Move IQ

# Turn Garmin Move IQ auto-detected events (grey in the app, never real activities)
# into activities.
#
#   method=summary  -> enrich-moveiq.py: one manual activity, summary fields set
#                      directly (HR, walking distance, calibrated calories); Garmin
#                      computes Training Effect. Time-in-zone / steps / intensity
#                      minutes go in the description only.
#   method=fit      -> backfill-moveiq-fit.py: synthesise + upload a FIT of the HR
#                      stream (+ step-derived distance for walks). Garmin computes
#                      HR zones, time-in-zone and intensity minutes from the stream.
#
# Default run is a DRY RUN. Set commit=true to write.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Day to scan: today | yesterday | YYYY-MM-DD"
        required: true
        default: "yesterday"
      method:
        description: "summary (manual activity) or fit (uploaded HR-stream FIT)"
        type: choice
        default: summary
        options: [summary, fit]
      commit:
        description: "Actually create/upload (otherwise dry-run)"
        type: boolean
        required: true
        default: false
      bike_type:
        description: "Garmin type for cycling Move IQ events"
        type: choice
        default: e_bike_fitness
        options: [e_bike_fitness, e_bike_mountain, cycling, gravel_cycling, road_biking]
      min_minutes:
        description: "Ignore events shorter than this"
        required: true
        default: "15"
      replace_ids:
        description: "Comma-separated activityIds to delete first (re-do)"
        required: false
        default: ""

jobs:
  backfill:
    runs-on: [self-hosted, docker-host]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Backfill Move IQ events
        run: |
          if [ "${{ inputs.method }}" = "fit" ]; then
            script=backfill-moveiq-fit.py
          else
            script=enrich-moveiq.py
          fi
          args=(--date "${{ inputs.date }}" --min-minutes "${{ inputs.min_minutes }}" --bike-type "${{ inputs.bike_type }}")
          if [ "${{ inputs.commit }}" = "true" ]; then args+=(--commit); fi
          IFS=',' read -ra ids <<< "${{ inputs.replace_ids }}"
          for id in "${ids[@]}"; do
            id="$(echo "$id" | tr -d '[:space:]')"
            [ -n "$id" ] && args+=(--replace-id "$id")
          done
          echo "$script ${args[*]}"
          docker run --rm \
            --env-file /docker/garmin-coaching-report/.env \
            -v /docker/garmin-coaching-report/tokens:/root/.garminconnect \
            -v "$PWD/garmin-coaching-report/scripts/$script:/tmp/$script:ro" \
            --entrypoint python \
            garmin-coaching-report:local \
            "/tmp/$script" "${args[@]}"
