version: '3.3'

services:
  pihole-exporter:
    image: ekofr/pihole-exporter:v1.2.0
    container_name: pihole-exporter
    restart: unless-stopped
    ports:
      - "9617:9617"
    environment:
      PIHOLE_HOSTNAME: 'pihole'
      PIHOLE_PORT: '80'
      PIHOLE_PROTOCOL: http
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD}
    networks:
      - docker_default

networks:
  docker_default:
    external: true
    name: docker_default
