[project]
name = "garmin-coaching-report"
version = "0.1.0"
description = "Weekly mountain sports coaching report from Garmin Connect via Claude"
requires-python = ">=3.12"
dependencies = [
    "garmin-connect-mcp",
    "anthropic>=0.40.0",
    "markdown>=3.7",
    "python-dotenv>=1.0.1",
    "requests>=2.31",
    "requests-oauthlib>=1.3.1",
]

[project.scripts]
garmin-coaching-report = "coaching_report.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coaching_report"]

[tool.uv.sources]
garmin-connect-mcp = { path = "vendor/garmin-connect-mcp" }
