version: '3.3'

# wger with PowerSync: Postgres (PowerSync requires it -- SQLite/Redis-only
# sync is not supported) + the PowerSync service itself, so the official
# mobile app's offline sync actually works. This is heavier than the
# original lean/SQLite deployment on purpose -- see the implementation
# history for why (the mobile app hard-requires a reachable PowerSync
# endpoint regardless of whether you use offline mode).

services:
  db:
    image: docker.io/postgres:15-alpine   # matches wger's own reference stack;
                                            # 15-alpine is a rolling PATCH tag.
    container_name: wger-db
    restart: unless-stopped
    env_file: [.env]
    environment:
      - TZ=America/Denver
    volumes:
      - /docker/wger/postgres-data:/var/lib/postgresql/data/
    networks:
      - docker_default
    # Tuning + wal_level=logical verbatim from wger-project/docker's
    # services/postgres.yaml -- wal_level=logical is required for PowerSync's
    # logical replication; the rest is sane defaults for a small instance.
    command: [
      "postgres",
      "-c", "wal_level=logical",
      "-c", "shared_buffers=256MB",
      "-c", "effective_cache_size=768MB",
      "-c", "work_mem=8MB",
      "-c", "random_page_cost=1.1",
      "-c", "max_connections=30"
    ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U \"$$POSTGRES_USER\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    mem_limit: 400m   # best-effort only -- see the note on the Pi's disabled
                       # memory cgroup controller elsewhere in this repo.

  web:
    image: docker.io/wger/server:2.7   # rolling PATCH tag, not :latest (which
                                        # resolves to a dev prerelease) and not
                                        # an exact patch (so Watchtower can pick
                                        # up 2.7.x fixes automatically). Moving
                                        # to 2.8 is a deliberate edit here, not
                                        # something that happens silently.
    container_name: wger-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: [.env]
    volumes:
      - /docker/wger/data:/home/wger/data
      - /docker/wger/static:/home/wger/static
      - /docker/wger/media:/home/wger/media
    networks:
      - docker_default
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    mem_limit: 512m

  powersync:
    image: docker.io/journeyapps/powersync-service:1.26   # rolling PATCH tag,
                                        # verified arm64-compatible (Pi 5) via
                                        # Docker Hub before pinning -- :latest
                                        # here tracks ahead of tagged releases,
                                        # same reasoning as wger's own pin above.
    container_name: wger-powersync
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    command: ["start", "-r", "unified"]   # API + replication worker together
                                            # -- single container, matches the
                                            # lean-where-possible approach.
    env_file: [.env]
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
      PS_JWKS_URL: http://web:8000/api/v2/powersync-keys
    volumes:
      - ./config-powersync:/config:ro
    networks:
      - docker_default
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    mem_limit: 300m

  nginx:
    image: docker.io/nginx:stable
    container_name: wger-nginx
    restart: unless-stopped
    depends_on:
      - web
      - powersync
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /docker/wger/static:/wger/static:ro
      - /docker/wger/media:/wger/media:ro
    ports:
      - "8010:80"
    networks:
      - docker_default
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    mem_limit: 64m

  watchtower:
    image: docker.io/containrrr/watchtower:latest
    container_name: wger-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Only touches containers explicitly labeled above -- never
      # garmin-coaching-report, homeassistant, or anything else on this host,
      # even though it needs the full docker socket to find them.
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 6 * * 0"   # Sunday 06:00 local
      WATCHTOWER_INCLUDE_RESTARTING: "true"
    mem_limit: 32m

networks:
  docker_default:
    external: true
    name: docker_default
