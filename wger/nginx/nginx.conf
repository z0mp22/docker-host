# Trimmed from wger-project/docker's config/nginx.conf: same upstream/static/
# media shape, with the PowerSync (/ps/) block dropped -- not used by this
# lean, SQLite-only deployment.

upstream wger {
    server web:8000;
}

server {
    listen 80;
    client_max_body_size 100M;

    location /static/ {
        alias /wger/static/;
    }

    location /media/ {
        alias /wger/media/;
    }

    location / {
        proxy_pass http://wger;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
