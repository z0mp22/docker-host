# Based on wger-project/docker's config/nginx.conf: same upstream/static/
# media shape, plus the /ps/ (PowerSync) location -- required once the
# mobile app expects a reachable PowerSync endpoint (see the implementation
# history for why this was added after initially being dropped).

upstream wger {
    server web:8000;
}

upstream powersync {
    server powersync:8080;
}

server {
    listen 80;
    client_max_body_size 100M;

    location /static/ {
        alias /wger/static/;
    }

    location /media/ {
        alias /wger/media/;
    }

    # PowerSync requirements (docs.powersync.com self-hosting / reverse-proxy
    # guidance, and wger's own admin docs): buffering off (sync is a
    # long-lived streamed connection, buffering would delay/break it),
    # extended timeouts (connections can be held open for a long time).
    location /ps/ {
        proxy_pass http://powersync/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    location / {
        proxy_pass http://wger;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
